<title>本活動專案中控台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout concept：開演前的舞台。固定背景層＝三盞鎢絲聚光燈＋舞台煙霧＋暗角＋底片顆粒；
   前景＝開場黑邊→片名卡（標題＋倒數）→玻璃分頁列→各視圖（卡片會接住游標上的光）。單一暗場視覺。 */
:root{
  color-scheme:dark;
  --void:#06070a; --stage:#0b0d12; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --edge:rgba(255,255,255,.09); --edge2:rgba(255,255,255,.16);
  --ink:#efe8dc; --dim:#9a9ca6; --faint:#5d606b;
  --amber:#f6b54e; --amber-glow:rgba(246,181,78,.55); --teal:#45c4b4; --teal-glow:rgba(69,196,180,.45);
  --red:#ff6a5f; --red-soft:rgba(255,106,95,.12); --green:#74d9a0; --green-soft:rgba(116,217,160,.12); --amber-soft:rgba(246,181,78,.12);
  --g-total:#a68cff; --g-b2b:#ff9f4a; --g-race:#5bb2ff; --g-b2c:#6fdc7a; --g-admin:#f3cf4b;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --title:"Bebas Neue","Noto Sans TC",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:16px; --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;position:relative}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.02em}
h3{font-size:16px;font-weight:700}
a{color:var(--amber)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .small{font-size:13px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber)}

/* ===== 舞台背景（固定） ===== */
.stagebg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(120% 70% at 50% -10%,#1a1712 0%,transparent 60%),
  radial-gradient(90% 60% at 50% 120%,#0d1418 0%,transparent 70%),var(--void)}
.beam{position:absolute;top:-25vh;width:46vw;height:150vh;transform-origin:50% 0;filter:blur(28px);mix-blend-mode:screen;opacity:.55}
.beam::before{content:"";position:absolute;inset:0;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);background:linear-gradient(to bottom,var(--c) 0%,transparent 78%)}
.b1{left:-6vw;--c:rgba(246,181,78,.42);transform:rotate(-24deg);animation:sway1 14s ease-in-out infinite alternate}
.b2{left:27vw;--c:rgba(255,236,200,.20);transform:rotate(3deg);animation:sway2 18s ease-in-out infinite alternate}
.b3{right:-8vw;--c:rgba(69,196,180,.34);transform:rotate(22deg);animation:sway3 16s ease-in-out infinite alternate}
@keyframes sway1{to{transform:rotate(-14deg)}} @keyframes sway2{to{transform:rotate(-6deg)}} @keyframes sway3{to{transform:rotate(30deg)}}
.haze{position:absolute;inset:-20%;background:
  radial-gradient(40% 25% at 30% 40%,rgba(255,240,220,.05),transparent 70%),
  radial-gradient(35% 22% at 70% 60%,rgba(120,220,210,.05),transparent 70%);animation:drift 30s linear infinite alternate}
@keyframes drift{to{transform:translate3d(6%,-4%,0) scale(1.08)}}
.vignette{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.65) 100%)}
.grain{position:fixed;inset:-50%;z-index:31;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* ===== 開場黑邊 ===== */
.letterbox{position:fixed;left:0;right:0;z-index:40;background:#000;pointer-events:none}
.lb-top{top:0;height:0;animation:lbt 1.6s var(--ease) both}
.lb-bot{bottom:0;height:0;animation:lbt 1.6s var(--ease) both}
@keyframes lbt{0%{height:50vh}35%{height:50vh}100%{height:0}}

/* ===== 片名卡 ===== */
.hero{position:relative;z-index:2;padding-block:max(36px,env(safe-area-inset-top,0px)) 26px}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end}
@media (max-width:760px){.herogrid{grid-template-columns:1fr}}
.title{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6.4vw,72px);letter-spacing:.04em;line-height:1.05;margin-top:12px;
  background:linear-gradient(180deg,#fff7ea 0%,#e9d6b6 55%,#9c8a6d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(246,181,78,.25));animation:focus 1.4s .55s var(--ease) both}
@keyframes focus{from{filter:blur(14px) drop-shadow(0 0 0 transparent);letter-spacing:.3em;opacity:.2}}
.flare{position:relative;height:2px;margin-top:14px;max-width:640px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.9) 40%,#fff 50%,rgba(140,230,220,.8) 60%,transparent);
  box-shadow:0 0 18px 2px rgba(255,210,150,.45);animation:flare 1.6s .9s var(--ease) both}
@keyframes flare{from{transform:scaleX(0);opacity:0}}
.sub{color:var(--dim);font-size:13px;margin-top:12px;animation:rise .9s 1.1s var(--ease) both}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.countdown{text-align:right;animation:rise 1s 1.2s var(--ease) both}
@media (max-width:760px){.countdown{text-align:left}}
.countdown .num{font-family:var(--title);font-size:clamp(84px,13vw,148px);line-height:.82;color:var(--amber);text-shadow:0 0 30px var(--amber-glow),0 0 80px rgba(246,181,78,.25);letter-spacing:.02em}
.countdown .lab{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim)}
.countdown .when{font-size:13px;color:var(--ink);margin-top:6px}

/* ===== 分頁列 ===== */
nav.tabs{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(to bottom,rgba(6,7,10,.92),rgba(6,7,10,.72));backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--edge)}
.tabrow{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--dim);white-space:nowrap;border-radius:10px;transition:color .3s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:#fff}
.tab .k{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:6px}
.tab .n{font-family:var(--mono);font-size:10px;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--glass2);color:var(--dim)}
.indicator{position:absolute;bottom:4px;height:2px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px 2px var(--amber-glow);transition:left .45s var(--ease),width .45s var(--ease)}
.hint{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.12em;white-space:nowrap;align-self:center;margin-left:auto;padding-left:12px}
@media (max-width:900px){.hint{display:none}}

main{position:relative;z-index:2;padding-block:26px 70px;min-height:70vh}
.view{display:grid;gap:18px}
.view.enter{animation:viewin .55s var(--ease) both}
@keyframes viewin{from{opacity:.0;transform:translateY(14px) scale(.995);filter:blur(6px)}}
.stag>*{animation:rise .7s var(--ease) both}
.stag>*:nth-child(2){animation-delay:.06s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.18s}.stag>*:nth-child(5){animation-delay:.24s}.stag>*:nth-child(n+6){animation-delay:.3s}

/* ===== 卡片（接光） ===== */
.card{--mx:50%;--my:-20%;position:relative;min-width:0;padding:20px;border-radius:var(--r);
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,226,180,.075),transparent 45%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px -30px rgba(0,0,0,.9);backdrop-filter:blur(6px);transition:border-color .3s,transform .4s var(--ease)}
.card:hover{border-color:var(--edge2)}
.card.spot{border-color:rgba(246,181,78,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(246,181,78,.15),0 0 60px -20px var(--amber-glow)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.head a{font-size:13px;text-decoration:none}
.kpi .l{font-size:12px;color:var(--dim);letter-spacing:.06em}
.kpi .v{font-family:var(--title);font-size:clamp(40px,6vw,56px);line-height:.95;margin-top:8px;letter-spacing:.02em;overflow-wrap:anywhere}
.kpi .v small{font-size:.45em;color:var(--faint)}
.kpi .s{font-size:12px;color:var(--faint);margin-top:4px}
.kpi.hot .v{color:var(--red);text-shadow:0 0 24px rgba(255,106,95,.4)}
.kpi.warm .v{color:var(--amber);text-shadow:0 0 24px var(--amber-glow)}
.kpi.cool .v{color:var(--teal);text-shadow:0 0 24px var(--teal-glow)}
.meter{height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;display:flex;margin-top:12px}
.meter i{display:block;height:100%;transform-origin:left;animation:grow 1.2s .3s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent;letter-spacing:.02em}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.s-todo{color:var(--dim);background:rgba(255,255,255,.04);border-color:var(--edge)} .s-todo::before{box-shadow:none;opacity:.5}
.s-doing{color:var(--teal);background:rgba(69,196,180,.1)}
.s-now{color:var(--amber);background:var(--amber-soft)}
.s-done{color:var(--green);background:var(--green-soft)}
.s-late,.s-blocked{color:var(--red);background:var(--red-soft)}
.s-missing{color:var(--amber);border:1px dashed rgba(246,181,78,.55);background:none} .s-missing::before{display:none}
.gtag{display:inline-flex;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap}
.gtag::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--gc);box-shadow:0 0 8px var(--gc);margin-right:7px}

/* list rows */
.rows{display:grid}
.row{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:13px 6px;border-top:1px solid rgba(255,255,255,.05);border-radius:10px;transition:background .25s}
.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.025)}
.row .code{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:3px}
.row .t{font-weight:500}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--dim);margin-top:4px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.row.missing .t{color:#c9c3b8}
.unassigned{color:var(--amber)}
.empty{padding:30px;text-align:center;color:var(--faint)}

/* banner */
.banner{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:var(--r);border:1px solid rgba(246,181,78,.35);
  background:linear-gradient(90deg,rgba(246,181,78,.12),rgba(246,181,78,.03));box-shadow:0 0 40px -20px var(--amber-glow)}
.banner .ic{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#1a1205;font-weight:900;font-family:var(--mono)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--edge)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--dim);transition:all .25s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:12px;padding:8px 12px;min-width:0}
select option{background:#14161c}
input[type=search]{flex:1 1 220px}
input[type=search]:focus,select:focus{outline:none;border-color:rgba(246,181,78,.6);box-shadow:0 0 0 3px rgba(246,181,78,.15)}

/* ===== 甘特 ===== */
.gscroll{overflow-x:auto;border-radius:var(--r);border:1px solid var(--edge);background:rgba(0,0,0,.35)}
.gantt{min-width:1000px;position:relative;font-size:12.5px}
.gh,.gr{display:grid;grid-template-columns:240px 1fr}
.gh{position:sticky;top:0;z-index:3;background:rgba(12,13,18,.96);border-bottom:1px solid var(--edge)}
.gl{padding:7px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid rgba(255,255,255,.06);color:var(--dim)}
.gl .code{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-right:7px}
.gr:hover .gl{color:var(--ink)} .gr:hover .gt{background:rgba(255,255,255,.02)}
.gt{position:relative;min-height:30px}
.months{display:flex;height:100%}
.months span{flex:1 0 0;padding:8px;border-left:1px solid rgba(255,255,255,.06);font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--dim)}
.ggroup .gl{color:var(--ink);font-weight:700;background:rgba(255,255,255,.025)}
.gbar{position:absolute;top:9px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gc),color-mix(in srgb,var(--gc) 70%,#fff));box-shadow:0 0 14px -2px var(--gc);transform-origin:left;animation:grow .9s var(--ease) both}
.gbar.missing{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--gc) 75%,transparent) 0 4px,transparent 4px 8px);border:1px solid var(--gc);box-shadow:none;opacity:.8}
.gbar.done{opacity:.3;box-shadow:none}
.gbar.alert{box-shadow:0 0 0 2px var(--red),0 0 16px var(--red)}
.vline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.05)}
.gevent{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(246,181,78,.14),rgba(246,181,78,.04))}
.gnow{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--amber);box-shadow:0 0 14px 3px var(--amber-glow);z-index:2;pointer-events:none}
.gnow span{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
.gms{position:absolute;top:8px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);background:#fff;border-radius:2px;box-shadow:0 0 12px rgba(255,255,255,.7);animation:pop .6s var(--ease) both}
@keyframes pop{from{transform:translateX(-50%) rotate(45deg) scale(0)}}

/* ===== 里程碑：底片條 ===== */
.film{position:relative;padding-left:46px}
.film::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;border-radius:6px;background:
  repeating-linear-gradient(to bottom,transparent 0 6px,rgba(255,255,255,.18) 6px 14px,transparent 14px 22px) left 5px top 0/7px 22px no-repeat repeat-y,
  repeating-linear-gradient(to bottom,transparent 0 6px,rgba(255,255,255,.18) 6px 14px,transparent 14px 22px) right 5px top 0/7px 22px no-repeat repeat-y,#111216;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.film::after{content:"";position:absolute;left:0;top:0;width:30px;height:var(--prog,0%);border-radius:6px;background:linear-gradient(180deg,rgba(246,181,78,.0),rgba(246,181,78,.35));box-shadow:0 0 20px var(--amber-glow);transition:height 1.4s var(--ease)}
.frame{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;margin-bottom:14px}
.frame::before{content:"";position:absolute;left:-36px;top:12px;width:10px;height:10px;border-radius:50%;background:#2a2c33;border:2px solid var(--gc)}
.frame.past::before{background:var(--gc);box-shadow:0 0 10px var(--gc)}
.frame.next::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 6px rgba(246,181,78,.15),0 0 18px var(--amber)}
.frame .date{text-align:right;padding-top:4px}
.frame .date b{display:block;font-family:var(--title);font-size:32px;line-height:.9;letter-spacing:.03em}
.frame.past .date b{color:var(--faint)}
.frame.next .date b{color:var(--amber);text-shadow:0 0 18px var(--amber-glow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--faint)} .kv dd{margin:0}
@media (max-width:640px){.frame{grid-template-columns:1fr}.frame .date{text-align:left;display:flex;gap:10px;align-items:baseline}.film{padding-left:40px}.frame::before{left:-30px}}

/* people */
.team{border-top:2px solid var(--gc)}
.team::after{content:"";position:absolute;left:10%;right:10%;top:-2px;height:2px;background:var(--gc);filter:blur(6px);opacity:.8}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}
.person:first-of-type{border-top:0}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:#111;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--gc) 55%,color-mix(in srgb,var(--gc) 50%,#000) 100%);box-shadow:0 0 16px -3px var(--gc)}
.person .who{flex:1;min-width:0}
.pill{border:1px solid var(--edge);background:rgba(255,255,255,.04);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--ink);transition:all .25s;white-space:nowrap}
.pill:hover{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px -4px var(--amber-glow)}

/* budget */
.bars{display:grid;gap:18px}
.bl .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:7px}
.track{position:relative;height:26px;border-radius:8px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:8px;transform-origin:left;animation:grow 1.3s .2s var(--ease) both}
.target{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;box-shadow:0 0 10px #fff}
.target span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px;border-top:1px solid rgba(255,255,255,.06);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--faint);font-weight:500;border-top:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tscroll{overflow-x:auto}

/* onboarding */
.steps{display:grid;gap:16px;counter-reset:s}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.step::before{counter-increment:s;content:"0" counter(s);font-family:var(--title);font-size:40px;line-height:.9;color:var(--amber);text-shadow:0 0 16px var(--amber-glow)}
dl.gloss{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:10px 16px;margin:0}
dl.gloss dt{font-family:var(--mono);font-size:13px;color:var(--amber)} dl.gloss dd{margin:0;color:var(--dim)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.links a{display:block;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.025);color:var(--ink);text-decoration:none;transition:all .3s}
.links a:hover{border-color:rgba(246,181,78,.5);box-shadow:0 0 26px -12px var(--amber-glow);transform:translateY(-2px)}
.links small{display:block;color:var(--faint);margin-top:2px}

footer{position:relative;z-index:2;font-size:11.5px;color:var(--faint);padding-block:0 50px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:640px){
  .row{grid-template-columns:56px minmax(0,1fr)} .row .side{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;text-align:left}
  .beam{opacity:.4} .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .letterbox{display:none}
}
</style>

<div class="stagebg" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="haze"></div></div>
<div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="letterbox lb-top" aria-hidden="true"></div><div class="letterbox lb-bot" aria-hidden="true"></div>

<header class="hero pad"><div class="wrap herogrid">
  <div>
    <p class="kicker">Tamkang Classical Guitar · Production Control</p>
    <h1 class="title">本活動<br>專案中控台</h1>
    <div class="flare" aria-hidden="true"></div>
    <p class="sub" id="snap"></p>
  </div>
  <div class="countdown" id="count"></div>
</div></header>
<nav class="tabs pad" aria-label="分頁"><div class="wrap"><div class="tabrow" role="tablist" id="tabs"></div></div></nav>
<main class="pad"><div class="wrap" id="app"></div></main>
<footer class="pad"><div class="wrap" id="foot"></div></footer>

<script>
const DATA = /*__DATA__*/null;
(function(){
"use strict";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const GROUPS=[
  {name:"總召、副召",short:"總召",c:"var(--g-total)"},{name:"廠商對接 B2B",short:"B2B",c:"var(--g-b2b)"},
  {name:"賽事運行",short:"賽事",c:"var(--g-race)"},{name:"行銷公關 B2C",short:"B2C",c:"var(--g-b2c)"},{name:"事務行政",short:"事務",c:"var(--g-admin)"}];
const GC=n=>{const g=GROUPS.find(g=>n&&n.indexOf(g.name)===0)||GROUPS.find(g=>n&&n.includes(g.short));return g?g.c:"var(--dim)";};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const day=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
const DAY=864e5,diff=(a,b)=>Math.round((a-b)/DAY);
const md=s=>{const d=day(s);return d?`${d.getMonth()+1}/${d.getDate()}`:"—";};
const money=n=>"NT$"+Math.round(n).toLocaleString("en-US");
const tasks=DATA.tasks.map(t=>{const s=day(t.start),e=day(t.end);let k;
  if(t.status==="完成")k="done";else if(t.status==="卡住")k="blocked";else if(e&&e<today)k="late";
  else if(s&&s<=today)k=t.status==="進行中"?"doing":"now";else k=t.status==="進行中"?"doing":"todo";
  return Object.assign({},t,{k,s,e});});
const KL={done:"完成",blocked:"卡住",late:"逾期",now:"該開始了",doing:"進行中",todo:"未開始"};
const chip=t=>`<span class="chip s-${t.k}">${KL[t.k]}</span>`+(t.missing?`<span class="chip s-missing" title="原規劃有這項工作，但目前活動總表沒有">總表缺漏</span>`:"");
const gtag=g=>`<span class="gtag" style="--gc:${GC(g)}">${esc(g)}</span>`;
const evStart=day(DATA.eventStart);
const pendDec=DATA.decisions.filter(d=>d.type!=="已確認");

/* ---------- 片名卡 ---------- */
document.getElementById("snap").textContent=`資料快照 ${DATA.snapshot}｜來源：本活動_活動總表_v2｜唯讀頁面，進度請改活動總表`;
const left=diff(evStart,today);
document.getElementById("count").innerHTML=left>=0
  ?`<div class="lab">DAYS TO OPENING NIGHT</div><div class="num" data-count="${left}">${left}</div><div class="when">距活動第一天｜${md(DATA.eventStart)}（日期待確認）</div>`
  :`<div class="lab">THE SHOW IS OVER</div><div class="num">FIN</div>`;
document.getElementById("foot").innerHTML=`快照 ${DATA.snapshot}｜重新產生：<span class="mono">python3 tools/make_dashboard.py 活動總表.xlsx output/project-dashboard.html</span>｜本頁不含電話、Email 等個資`;

/* ---------- 分頁 ---------- */
const VIEWS=[["overview","總覽"],["timeline","時間軸"],["tasks","全部工作",tasks.length],["milestones","里程碑",DATA.milestones.length],
  ["decisions","待決事項",pendDec.length],["people","組別與人員"],["budget","經費"],["start","新手上手"]];
const tabs=document.getElementById("tabs");
tabs.innerHTML=VIEWS.map(([id,l,n],i)=>`<button class="tab" role="tab" data-v="${id}"><span class="k">${i+1}</span>${l}${n!=null?`<span class="n">${n}</span>`:""}</button>`).join("")
  +`<span class="hint">鍵盤 1–8 切換｜/ 搜尋</span><span class="indicator" id="ind"></span>`;
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.v);});
const app=document.getElementById("app");
const state={group:"全部",status:"全部",q:"",owner:""};
try{Object.assign(state,JSON.parse(localStorage.getItem("dash-filter")||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem("dash-filter",JSON.stringify(state));}catch(e){}};
function moveInd(){const a=tabs.querySelector('[aria-selected="true"]'),ind=document.getElementById("ind");if(!a)return;ind.style.left=a.offsetLeft+10+"px";ind.style.width=a.offsetWidth-20+"px";}
function go(v){if(location.hash.slice(1)===v)route();else location.hash=v;}
let first=true;
function route(){
  let v=(location.hash||"#overview").slice(1);if(!VIEWS.some(x=>x[0]===v))v="overview";
  tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v?"true":"false"));
  const act=tabs.querySelector('[aria-selected="true"]');if(act&&!first)act.scrollIntoView({inline:"nearest",block:"nearest",behavior:RM?"auto":"smooth"});
  moveInd();
  app.innerHTML=`<section class="view${RM?"":" enter"}">${R[v]()}</section>`;
  (A[v]||(()=>{}))();
  wire();
  if(!first){const nav=document.querySelector("nav.tabs");if(window.scrollY>nav.offsetTop)window.scrollTo({top:nav.offsetTop,behavior:RM?"auto":"smooth"});}
  first=false;
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",moveInd);
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  const n=+e.key;if(n>=1&&n<=VIEWS.length){go(VIEWS[n-1][0]);}
  if(e.key==="/"){e.preventDefault();go("tasks");setTimeout(()=>document.getElementById("q")?.focus(),60);}
});

/* 光：卡片接住游標＋聚光燈跟著視差 */
function wire(){
  app.querySelectorAll(".card").forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px");}));
  if(!RM)app.querySelectorAll("[data-count]").forEach(countUp);
}
function countUp(el){const to=+el.dataset.count,pre=el.dataset.pre||"",t0=performance.now(),dur=900;if(!to){el.textContent=pre+"0";return;}
  const f=now=>{const p=Math.min(1,(now-t0)/dur),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=pre+(el.dataset.money?v.toLocaleString("en-US"):v);if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
if(!RM){const bs=document.querySelectorAll(".beam");let raf=0;window.addEventListener("pointermove",e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  bs.forEach((b,i)=>b.style.translate=`${x*(i+1)*14}px ${y*10}px`);});});}
const hc=document.querySelector(".countdown .num[data-count]");if(hc&&!RM)setTimeout(()=>countUp(hc),1200);

/* ---------- 共用 ---------- */
function rowHTML(t){
  const rem=t.k==="late"?`逾期 ${diff(today,t.e)} 天`:(t.e?`剩 ${diff(t.e,today)} 天`:"");
  return `<div class="row${t.missing?" missing":""}"><div class="code">${esc(t.code)}</div>
    <div><div class="t">${esc(t.title)}</div>
      <div class="meta">${gtag(t.group)}<span>${t.owner?esc(t.owner):'<span class="unassigned">未指派</span>'}</span><span class="mono">${md(t.start)} → ${md(t.end)}</span>${t.pre?`<span>前置 <span class="mono">${esc(t.pre)}</span></span>`:""}</div>
      ${t.note?`<div class="meta">${esc(t.note)}</div>`:""}</div>
    <div class="side">${chip(t)}${t.k!=="done"&&rem?`<span class="small dim mono">${rem}</span>`:""}</div></div>`;}
function groupSeg(){return `<div class="seg" role="group" aria-label="組別">${["全部",...GROUPS.map(g=>g.name)].map(n=>`<button data-g="${esc(n)}" aria-pressed="${state.group===n}">${n==="全部"?"全部":esc(GROUPS.find(g=>g.name===n).short)}</button>`).join("")}</div>`;}
function bindGroupSeg(){app.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{state.group=b.dataset.g;save();route();}));}
const R={},A={};

/* ---------- 總覽 ---------- */
R.overview=()=>{
  const done=tasks.filter(t=>t.k==="done").length,late=tasks.filter(t=>t.k==="late").length,blocked=tasks.filter(t=>t.k==="blocked").length;
  const wk=new Date(+today+7*DAY),week=tasks.filter(t=>t.k!=="done"&&t.s&&t.s<=wk&&t.e>=today).sort((a,b)=>a.e-b.e);
  const nx=DATA.milestones.find(m=>day(m.date)>=today&&m.status!=="完成"),un=tasks.filter(t=>!t.owner&&t.k!=="done").length;
  const dec=pendDec.filter(d=>d.due).sort((a,b)=>day(a.due)-day(b.due)),b=DATA.budget,conf=b.income.filter(i=>i.status==="已確認").reduce((s,i)=>s+i.amount,0);
  const pct=ks=>tasks.filter(t=>ks.includes(t.k)).length/tasks.length*100;
  return `${DATA.missingCount?`<div class="banner"><div class="ic">!</div><div><b style="color:var(--amber)">資料提醒</b>　活動總表目前只有 ${DATA.sheetCount} 項工作；原規劃另外 ${DATA.missingCount} 項（總召、賽事、B2C 全部，以及部分 B2B、事務）不在總表裡。本頁以虛線標成「總表缺漏」，請總召確認後補回。</div></div>`:""}
  <div class="grid g4 stag">
    <div class="card kpi cool"><div class="l">工作完成</div><div class="v"><span data-count="${done}">${done}</span><small>／${tasks.length}</small></div>
      <div class="meter"><i style="width:${pct(["done"])}%;background:var(--green)"></i><i style="width:${pct(["doing","now"])}%;background:var(--teal)"></i><i style="width:${pct(["late","blocked"])}%;background:var(--red)"></i></div></div>
    <div class="card kpi ${late?"hot":""}"><div class="l">逾期未完成</div><div class="v" data-count="${late}">${late}</div><div class="s">截止日已過、還沒完成</div></div>
    <div class="card kpi ${blocked?"hot":""}"><div class="l">卡住</div><div class="v" data-count="${blocked}">${blocked}</div><div class="s">需要總召出手</div></div>
    <div class="card kpi ${un?"warm":""}"><div class="l">尚未指派負責人</div><div class="v" data-count="${un}">${un}</div><div class="s">含總表缺漏的工作</div></div>
  </div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><div class="head"><div><p class="kicker">This week</p><h2>這 7 天要動的工作</h2></div><a href="#tasks">看全部 →</a></div>
      <div class="rows">${week.length?week.map(rowHTML).join(""):'<div class="empty">這週沒有排定的工作</div>'}</div></div>
    <div class="grid stag" style="align-content:start">
      ${nx?`<div class="card spot"><p class="kicker">Next gate</p><div style="display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:6px"><h2 style="font-size:28px">${esc(nx.title)}</h2>
        <div style="text-align:right"><div style="font-family:var(--title);font-size:46px;line-height:.85;color:var(--amber);text-shadow:0 0 20px var(--amber-glow)">${diff(day(nx.date),today)}</div><div class="small dim">天後｜${md(nx.date)}</div></div></div>
        <dl class="kv"><dt>通過條件</dt><dd>${esc(nx.cond)}</dd><dt>沒過怎麼辦</dt><dd>${esc(nx.fallback)}</dd><dt>主責</dt><dd>${gtag(nx.group)}</dd></dl></div>`:""}
      <div class="card"><div class="head"><div><p class="kicker">Decisions</p><h3>最近要拍板的事</h3></div><a href="#decisions">全部 ${pendDec.length} 項 →</a></div>
        <div class="rows">${dec.slice(0,4).map(d=>`<div class="row" style="grid-template-columns:40px minmax(0,1fr) auto"><div class="code">${esc(d.code)}</div><div><div class="t">${esc(d.q)}</div><div class="meta">建議：${esc(d.rec)}</div></div><div class="side mono small">${md(d.due)}</div></div>`).join("")}</div></div>
      <div class="card"><div class="head"><div><p class="kicker">Budget</p><h3>經費</h3></div><a href="#budget">詳細 →</a></div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <div><div class="small dim">方案三總支出</div><div class="mono" style="font-size:20px;font-weight:700">${money(b.total[2])}</div></div>
          <div><div class="small dim">目前缺口</div><div class="mono" style="font-size:20px;font-weight:700;color:var(--red);text-shadow:0 0 16px rgba(255,106,95,.35)">${money(b.gapConfirmed[2])}</div></div></div>
        <p class="small dim" style="margin:10px 0 0">已確認收入 <b class="mono" style="color:${conf?"var(--green)":"var(--red)"}">${money(conf)}</b>｜停損點 2/26</p></div>
    </div></div>
  <div class="card"><div class="head"><div><p class="kicker">Departments</p><h2>各組進度</h2></div><span class="legend"><span><i class="dot" style="background:var(--green)"></i>完成</span><span><i class="dot" style="background:var(--teal)"></i>進行中／該開始</span><span><i class="dot" style="background:var(--red)"></i>逾期／卡住</span></span></div>
    <div class="grid" style="gap:16px">${GROUPS.map(g=>{const ts=tasks.filter(t=>t.group===g.name);if(!ts.length)return"";const c=k=>ts.filter(t=>k.includes(t.k)).length/ts.length*100,miss=ts.filter(t=>t.missing).length;
      return `<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px">${gtag(g.name)}<span class="dim small mono">${ts.filter(t=>t.k==="done").length}/${ts.length}${miss?`　缺漏 ${miss}`:""}</span></div>
      <div class="meter" style="height:6px"><i style="width:${c(["done"])}%;background:var(--green)"></i><i style="width:${c(["doing","now"])}%;background:var(--teal);box-shadow:0 0 10px var(--teal)"></i><i style="width:${c(["late","blocked"])}%;background:var(--red)"></i></div></div>`;}).join("")}</div></div>`;
};

/* ---------- 時間軸 ---------- */
R.timeline=()=>`<div class="head"><div><p class="kicker">Production schedule</p><h2>七個月時間軸</h2></div><span class="legend"><span><i class="dot" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></i>NOW 今天</span><span>◆ 里程碑</span><span>斜線＝總表缺漏</span><span>淡色＝已完成</span></span></div>
  <div class="filters">${groupSeg()}</div>
  <div class="gscroll" tabindex="0" aria-label="甘特圖，可左右捲動"><div class="gantt" id="gantt"></div></div>
  <p class="small dim">色塊是計畫期間，不代表已完成。滑鼠移到色塊上看負責人與日期。</p>`;
A.timeline=()=>{
  const start=new Date(2026,10,1),end=new Date(2027,5,1),span=end-start,x=d=>Math.max(0,Math.min(100,(d-start)/span*100));
  const months=[];for(let d=new Date(start);d<end;d.setMonth(d.getMonth()+1))months.push(`${d.getFullYear()%100}.${String(d.getMonth()+1).padStart(2,"0")}`);
  const vl=months.map((_,i)=>`<div class="vline" style="left:${i/months.length*100}%"></div>`).join("");
  const on=today>=start&&today<end,now=on?`<div class="gnow" style="left:${x(today)}%"></div>`:"",nowL=on?`<div class="gnow" style="left:${x(today)}%"><span>NOW</span></div>`:"";
  const ev=`<div class="gevent" style="left:${x(evStart)}%;width:${x(new Date(+day(DATA.eventEnd)+DAY))-x(evStart)}%"></div>`;
  let h=`<div class="gh"><div class="gl" style="color:var(--ink)"><b>工作</b></div><div class="gt"><div class="months">${months.map(m=>`<span>${m}</span>`).join("")}</div></div></div>`;
  h+=`<div class="gr ggroup"><div class="gl">◆ 里程碑</div><div class="gt">${vl}${ev}${DATA.milestones.map((m,i)=>`<div class="gms" style="left:${x(day(m.date))}%;animation-delay:${.3+i*.05}s" title="${esc(m.code+" "+m.title+"｜"+md(m.date))}"></div>`).join("")}${nowL}</div></div>`;
  let i=0;
  GROUPS.filter(g=>state.group==="全部"||state.group===g.name).forEach(g=>{const ts=tasks.filter(t=>t.group===g.name).sort((a,b)=>a.s-b.s);if(!ts.length)return;
    h+=`<div class="gr ggroup"><div class="gl">${gtag(g.name)}</div><div class="gt" style="min-height:26px">${vl}${now}</div></div>`;
    ts.forEach(t=>{const l=x(t.s),w=Math.max(.6,x(new Date(+t.e+DAY))-l);
      h+=`<div class="gr"><div class="gl" title="${esc(t.title)}"><span class="code">${esc(t.code)}</span>${esc(t.title)}</div><div class="gt">${vl}${ev}
      <div class="gbar ${t.missing?"missing":""} ${t.k==="done"?"done":""} ${t.k==="blocked"||t.k==="late"?"alert":""}" style="--gc:${g.c};left:${l}%;width:${w}%;animation-delay:${Math.min(i++*.018,.9)}s" title="${esc(`${t.code} ${t.title}｜${md(t.start)}→${md(t.end)}｜${t.owner||"未指派"}｜${KL[t.k]}${t.missing?"｜總表缺漏":""}`)}"></div>${now}</div></div>`;});});
  document.getElementById("gantt").innerHTML=h;bindGroupSeg();
};

/* ---------- 全部工作 ---------- */
R.tasks=()=>{const owners=[...new Set(tasks.map(t=>t.owner).filter(Boolean))];
  return `<div class="head"><div><p class="kicker">Call sheet</p><h2>全部工作</h2></div><span class="small dim" id="tcount"></span></div>
  <div class="card" style="padding:14px"><div class="filters">${groupSeg()}
    <div class="seg" role="group" aria-label="狀態">${["全部","待處理","逾期","卡住","完成","總表缺漏"].map(s=>`<button data-st="${s}" aria-pressed="${state.status===s}">${s}</button>`).join("")}</div>
    <select id="owner" aria-label="負責人"><option value="">所有負責人</option>${owners.map(o=>`<option ${state.owner===o?"selected":""}>${esc(o)}</option>`).join("")}<option value="__none" ${state.owner==="__none"?"selected":""}>未指派</option></select>
    <input type="search" id="q" placeholder="搜尋工作、編號、備註…（按 / 跳到這裡）" value="${esc(state.q)}" aria-label="搜尋"></div></div>
  <div class="card"><div class="rows" id="tlist"></div></div>`;};
A.tasks=()=>{const draw=()=>{const q=state.q.trim().toLowerCase();
    const L=tasks.filter(t=>(state.group==="全部"||t.group===state.group)
      &&(state.status==="全部"||(state.status==="待處理"&&t.k!=="done")||(state.status==="逾期"&&t.k==="late")||(state.status==="卡住"&&t.k==="blocked")||(state.status==="完成"&&t.k==="done")||(state.status==="總表缺漏"&&t.missing))
      &&(!state.owner||(state.owner==="__none"?!t.owner:t.owner===state.owner))&&(!q||(t.code+t.title+t.note+t.owner).toLowerCase().includes(q))).sort((a,b)=>a.e-b.e);
    document.getElementById("tlist").innerHTML=L.length?L.map(rowHTML).join(""):'<div class="empty">沒有符合條件的工作。試著清除篩選。</div>';
    document.getElementById("tcount").textContent=`顯示 ${L.length}／${tasks.length} 項｜依截止日排序`;};
  bindGroupSeg();
  app.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>{state.status=b.dataset.st;save();app.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();}));
  document.getElementById("owner").addEventListener("change",e=>{state.owner=e.target.value;save();draw();});
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;save();draw();});draw();};

/* ---------- 里程碑 ---------- */
R.milestones=()=>{const ms=DATA.milestones,nx=ms.find(m=>day(m.date)>=today&&m.status!=="完成");
  return `<div class="head"><div><p class="kicker">Thirteen gates</p><h2>13 個關卡</h2></div><span class="small dim">關卡沒過就不往下走：沒評審不開報名，沒錢不簽約。</span></div>
  <div class="film" id="film">${ms.map((m,i)=>{const d=day(m.date),past=d<today||m.status==="完成";
    return `<div class="frame ${past?"past":""} ${m===nx?"next":""}" style="--gc:${GC(m.group)};animation:rise .6s ${i*.04}s var(--ease) both">
      <div class="date"><b>${md(m.date)}</b><span class="small dim">${past?"已過":`${diff(d,today)} 天後`}</span></div>
      <div class="card ${m===nx?"spot":""}" style="padding:16px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><h3><span class="mono dim small">${esc(m.code)}</span>　${esc(m.title)}</h3>
        <span>${m===nx?'<span class="chip s-now">下一關</span> ':""}<span class="chip ${m.status==="完成"?"s-done":m.status==="卡住"?"s-blocked":"s-todo"}">${esc(m.status)}</span></span></div>
        <dl class="kv"><dt>主責</dt><dd>${gtag(m.group)}</dd><dt>通過條件</dt><dd>${esc(m.cond)}</dd><dt>沒過怎麼辦</dt><dd>${esc(m.fallback)}</dd></dl></div></div>`;}).join("")}</div>`;};
A.milestones=()=>{const ms=DATA.milestones,f=document.getElementById("film"),n=ms.filter(m=>day(m.date)<today||m.status==="完成").length;
  const target=n?(n/ms.length*100)+"%":"14px";if(RM)f.style.setProperty("--prog",target);else requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.setProperty("--prog",target)));};

/* ---------- 待決事項 ---------- */
R.decisions=()=>{const by=t=>DATA.decisions.filter(d=>d.type===t),pend=by("待決").sort((a,b)=>day(a.due)-day(b.due));
  const row=d=>{const due=day(d.due),dl=due?diff(due,today):null;
    return `<div class="row" style="grid-template-columns:40px minmax(0,1fr) auto"><div class="code">${esc(d.code)}</div>
      <div><div class="t">${esc(d.q)}</div><div class="meta">建議：<span style="color:var(--ink)">${esc(d.rec)}</span></div>${d.opts?`<div class="meta">選項：${esc(d.opts)}</div>`:""}${d.answer?`<div class="meta" style="color:var(--green)">決議：${esc(d.answer)}</div>`:""}</div>
      <div class="side">${due?`<span class="mono small">${md(d.due)}</span><span class="chip ${dl<0?"s-late":dl<=7?"s-now":"s-todo"}">${dl<0?`過期 ${-dl} 天`:`${dl} 天後`}</span>`:""}${d.ms?`<span class="small mono" style="color:var(--faint)">${esc(d.ms)}</span>`:""}</div></div>`;};
  return `<div class="grid g2" style="align-items:start"><div class="card"><div class="head"><div><p class="kicker">On the table</p><h2>幹部會議要決定</h2></div><span class="small dim">${pend.length} 項｜依期限</span></div><div class="rows">${pend.map(row).join("")}</div></div>
    <div class="grid stag" style="align-content:start"><div class="card"><div class="head"><div><p class="kicker">Awaiting reply</p><h3>等學校或外部回覆</h3></div></div><div class="rows">${by("待確認").map(row).join("")}</div></div>
    <div class="card"><div class="head"><div><p class="kicker">Locked</p><h3>已確認的事</h3></div></div><div class="rows">${by("已確認").map(row).join("")}</div></div></div></div>`;};

/* ---------- 組別與人員 ---------- */
R.people=()=>`<div class="head"><div><p class="kicker">Crew</p><h2>組別與人員</h2></div><span class="small dim">按「看工作」，直接篩出這個人負責的工作。</span></div>
  <div class="grid g3 stag">${GROUPS.map(g=>{const ps=DATA.people.filter(p=>p.group===g.name),ts=tasks.filter(t=>t.group===g.name),un=ts.filter(t=>!t.owner).length;
    return `<div class="card team" style="--gc:${g.c}"><div class="head"><h3>${esc(g.name)}</h3><span class="small dim mono">${ts.length} 項</span></div>
      ${ps.map(p=>{const n=tasks.filter(t=>t.owner===p.name&&t.k!=="done").length;
        return `<div class="person"><div class="av">${esc(p.name.slice(-2,-1)||p.name[0])}</div><div class="who"><div><b>${esc(p.name)}</b>　<span class="small dim">${esc(p.role)}</span></div>${p.note?`<div class="small" style="color:var(--faint)">${esc(p.note)}</div>`:""}</div><button class="pill" data-owner="${esc(p.name)}">看工作 ${n}</button></div>`;}).join("")||'<p class="dim small">名冊尚未登錄</p>'}
      ${un?`<p class="small" style="color:var(--amber);margin:10px 0 0">還有 ${un} 項工作未指派個人</p>`:""}</div>`;}).join("")}</div>`;
A.people=()=>app.querySelectorAll("[data-owner]").forEach(b=>b.addEventListener("click",()=>{Object.assign(state,{owner:b.dataset.owner,group:"全部",status:"全部",q:""});save();go("tasks");}));

/* ---------- 經費 ---------- */
R.budget=()=>{const b=DATA.budget,max=Math.max(...b.total)*1.06,conf=b.income.filter(i=>i.status==="已確認").reduce((s,i)=>s+i.amount,0),est=b.income.reduce((s,i)=>s+i.amount,0);
  const line=(lab,v,bg,glow,i)=>`<div class="bl"><div class="lab"><span>${lab}</span><b class="mono">${money(v)}</b></div><div class="track"><i style="width:${v/max*100}%;background:${bg};box-shadow:0 0 22px -4px ${glow};animation-delay:${.2+i*.12}s"></i>${i===0?`<div class="target" style="left:${b.target/max*100}%"><span>目標 10 萬</span></div>`:`<div class="target" style="left:${b.target/max*100}%"></div>`}</div></div>`;
  const sc={"已確認":"s-done","申請中":"s-doing","預估":"s-todo"};
  return `<div class="grid g4 stag">
    <div class="card kpi"><div class="l">建議方案總支出</div><div class="v" style="font-size:clamp(30px,4.6vw,42px)">${money(b.total[2])}</div><div class="s">含 10% 預備金</div></div>
    <div class="card kpi ${conf?"cool":"hot"}"><div class="l">已確認收入</div><div class="v" style="font-size:clamp(30px,4.6vw,42px)">${money(conf)}</div><div class="s">只有這個是真的錢</div></div>
    <div class="card kpi"><div class="l">全部預估收入</div><div class="v" style="font-size:clamp(30px,4.6vw,42px)">${money(est)}</div><div class="s">還沒到位，不能當現金</div></div>
    <div class="card kpi hot"><div class="l">目前缺口（只看已確認）</div><div class="v" style="font-size:clamp(30px,4.6vw,42px)">${money(b.gapConfirmed[2])}</div><div class="s">預估全到位仍缺 ${money(b.gapAll[2])}</div></div></div>
  <div class="card"><div class="head"><div><p class="kicker">Three cuts</p><h2>三個方案比較</h2></div><span class="legend"><span>白線＝目標 NT$100,000</span></span></div>
    <div class="bars" style="margin-top:10px">${b.plans.map((p,i)=>line(p+(i===2?"　建議":""),b.total[i],i===2?"linear-gradient(90deg,#c9862c,var(--amber))":"linear-gradient(90deg,#2b2e36,#4a4e59)",i===2?"var(--amber-glow)":"transparent",i)).join("")}
    ${line("方案三精簡執行（獎金贊助、野餐墊用借、樂團自帶鼓組）",b.lean[2],"linear-gradient(90deg,#1f7f73,var(--teal))","var(--teal-glow)",3)}</div>
    <p class="small dim" style="margin:14px 0 0">所有單價目前都是純假設或同類參考，實際報價 0 筆。場地若要收費，方案三可能再多約 NT$26,400。</p></div>
  <div class="card"><div class="head"><div><p class="kicker">Funding</p><h2>經費來源</h2></div><span class="legend"><span class="chip s-done">已確認</span><span class="chip s-doing">申請中</span><span class="chip s-todo">預估</span></span></div>
    <div class="tscroll"><table><thead><tr><th>來源</th><th class="num">金額</th><th>狀態</th><th>說明</th></tr></thead><tbody>
    ${b.income.map(i=>`<tr><td>${esc(i.name)}</td><td class="num">${money(i.amount)}</td><td><span class="chip ${sc[i.status]||"s-todo"}">${esc(i.status)}</span></td><td class="small dim">${esc(i.note)}</td></tr>`).join("")}</tbody></table></div></div>`;};

/* ---------- 新手上手 ---------- */
R.start=()=>`<div class="grid g2 stag" style="align-items:start">
  <div class="card spot"><p class="kicker">First day on set</p><h2 style="margin-top:6px">第一次接手？照這 5 步</h2><p class="dim small" style="margin:8px 0 18px">先看懂全貌，再找自己的工作。不用一次讀完所有文件。</p>
    <div class="steps">
      <div class="step"><div><b>用 2 分鐘看「總覽」</b><div class="dim">離活動幾天、下一個關卡、這週要動哪些工作。</div></div></div>
      <div class="step"><div><b>到「組別與人員」按自己的名字</b><div class="dim">直接篩出你負責的工作，依截止日排好。</div></div></div>
      <div class="step"><div><b>看「里程碑」裡你這組的關卡</b><div class="dim">「通過條件」就是你這組要交出的成果。</div></div></div>
      <div class="step"><div><b>每週開會前更新活動總表</b><div class="dim">本頁是快照。進度改在 Google 試算表「本活動_活動總表_v2」，改完請總召重新產生本頁。</div></div></div>
      <div class="step"><div><b>卡住就標「卡住」，並告訴總召</b><div class="dim">卡住不丟臉，藏起來才麻煩。不確定的規定或價格寫「待確認」，不要自己猜。</div></div></div></div></div>
  <div class="grid" style="align-content:start">
    <div class="card"><p class="kicker">Logline</p><h2 style="margin-top:6px">活動一句話</h2><p style="margin:10px 0 6px">兩天的免費校園音樂活動：<b>週四</b>校內音樂社團演出＋小市集（戶外），<b>週五</b>全國大專歌唱比賽決賽（建議室內）。四件事都要做到：校內展演、歌唱比賽＋評審、跨校參賽、市集。</p>
      <p class="small dim" style="margin:0">最高原則：第一次辦，穩定比華麗重要。遇到選擇，選比較省錢、省人力、不容易出錯的那個。</p></div>
    <div class="card"><p class="kicker">Glossary</p><h2 style="margin:6px 0 12px">名詞小辭典</h2><dl class="gloss">
      <dt>B2B</dt><dd>對廠商、贊助商、評審的組（廠商對接組）</dd><dt>B2C</dt><dd>對觀眾、選手的宣傳組（行銷公關組）</dd>
      <dt>PALT</dt><dd>校內音控團隊，負責音響</dd><dt>Backline</dt><dd>樂團上台用的鼓組、音箱</dd>
      <dt>里程碑</dt><dd>一個要「過關」的日期，沒過就不往下走</dd><dt>停損點</dt><dd>2/26 檢查錢夠不夠；不夠就照順序刪減</dd>
      <dt>T-72／T-24</dt><dd>活動前 72／24 小時，看天氣做決定</dd><dt>總表缺漏</dt><dd>原規劃有、但活動總表目前沒有的工作</dd></dl></div></div></div>
  <div class="card"><p class="kicker">Production files</p><h2 style="margin:6px 0 4px">重要文件</h2><p class="dim small" style="margin:0 0 14px">都在 Google 雲端「歌神杯」資料夾。</p><div class="links">
    ${[["本活動_活動總表_v2","每週更新狀態的地方","https://docs.google.com/spreadsheets/d/1SjKFqZZPYdVReN-dzqO-a4tQp4ng4pgvW5t7gniDx3g/edit"],
       ["專案背景與決策紀錄 v3","唯一真實來源，先讀這份","https://drive.google.com/file/d/1cgyhsKSl-az67s4LMNgrIA6vFJMtVwBD/view"],
       ["可行性評估","為什麼選方案三、前 5 大風險","https://docs.google.com/document/d/1pOFKnr5Y6aM7QuNJk_gHn_Iugnv_8_hiEwWZKEeWjvE/edit"],
       ["預算與經費來源","每一筆錢從哪來、花去哪","https://docs.google.com/spreadsheets/d/1z6bIEBRQc8yD0dPoYbuTeOKUKgQKYJ0mAMpMDNtwfiQ/edit"],
       ["比賽章程草案","賽事組必讀","https://docs.google.com/document/d/1Gu6C26bdkIY5DB0AvNO8VpOqtXc--R4ax8qdPuSoDi8/edit"],
       ["問題清單與待決事項","要問課外組的問題","https://docs.google.com/document/d/1ImuWTuFZQD2Pd02DM0RunjsK5z8Yf7NJWIXjh5PULv8/edit"],
       ["工作人員名單與班表","活動當天誰在哪","https://docs.google.com/document/d/1o16xlAfZ_eBqekH2PePaagZDz1rndwY2Z3on5VzlEVM/edit"],
       ["補助與贊助申請時程","B2B 必讀","https://docs.google.com/spreadsheets/d/1U-IB7LMhWdUErZ_NL7BHH4BATWnTdfmg4HYzKgx4oqQ/edit"]]
      .map(([t,d,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}<small>${d}</small></a>`).join("")}</div></div>`;

route();
})();
</script>
