<title>本活動專案中控台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout：舞台監督的提詞本。桌機＝左側導覽＋主欄；手機＝頂部精簡列＋底部分頁列（4＋更多）。
   全站單一無襯線字族＋資料用等寬數字；唯一的「演出時刻」是總覽簡報區的那盞舞台燈。 */
:root{
  /* 中性色：淺色＝白天教室、會議；深色＝晚上滑手機 */
  --page:#f2f3f5; --panel:#ffffff; --panel-2:#e9ebef; --sunken:#f6f7f9;
  --line:#dcdfe5; --line-strong:#c3c8d1;
  --ink:#15171c; --ink-2:#434852; --ink-3:#5e6470;
  /* 主色：舞台燈琥珀（填色用）＋深琥珀（文字用） */
  --amber:#d98a12; --amber-ink:#8a4f00; --amber-wash:#fbefd9; --on-amber:#1a1205;
  /* 語意色 */
  --danger:#b4291f; --danger-wash:#fbe5e2; --warn:#8f5200; --warn-wash:#fdf0dc; --ok:#1b6e40; --ok-wash:#e2f2e8; --info:#1f5ea0; --info-wash:#e3edf8;
  /* 組別標記 */
  --g-total:#6a4dc0; --g-b2b:#bb5a0c; --g-race:#1d6ab0; --g-b2c:#2d8237; --g-admin:#8f7200;
  --shadow-1:0 1px 2px rgba(15,17,22,.06),0 1px 1px rgba(15,17,22,.04);
  --shadow-2:0 6px 16px -6px rgba(15,17,22,.14),0 2px 4px rgba(15,17,22,.05);
  --shadow-3:0 24px 48px -16px rgba(15,17,22,.28),0 4px 10px rgba(15,17,22,.06);
  --spot:radial-gradient(70% 120% at 12% -10%,rgba(255,196,110,.38),rgba(255,196,110,0) 62%);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:16px; --fs-lg:19px; --fs-xl:23px; --fs-2xl:28px; --fs-display:56px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(.16,1,.3,1); --t1:120ms; --t2:200ms; --t3:320ms;
  --side:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d0f12; --panel:#15181d; --panel-2:#111317; --sunken:#1a1e24; --line:#272c34; --line-strong:#39404b;
  --ink:#eceef2; --ink-2:#bcc1ca; --ink-3:#979ea9;
  --amber:#f0a43a; --amber-ink:#f5b965; --amber-wash:#2c2010; --on-amber:#1a1205;
  --danger:#ff8a80; --danger-wash:#34191a; --warn:#f2b45a; --warn-wash:#302311; --ok:#6fd49a; --ok-wash:#132a1d; --info:#7db6f5; --info-wash:#132438;
  --g-total:#a690ff; --g-b2b:#ff9d55; --g-race:#67b5ff; --g-b2c:#78d685; --g-admin:#e5c24f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 20px -8px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.3); --shadow-3:0 28px 56px -16px rgba(0,0,0,.75);
  --spot:radial-gradient(70% 120% at 12% -10%,rgba(240,164,58,.24),rgba(240,164,58,0) 62%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0f12; --panel:#15181d; --panel-2:#111317; --sunken:#1a1e24; --line:#272c34; --line-strong:#39404b;
  --ink:#eceef2; --ink-2:#bcc1ca; --ink-3:#979ea9;
  --amber:#f0a43a; --amber-ink:#f5b965; --amber-wash:#2c2010; --on-amber:#1a1205;
  --danger:#ff8a80; --danger-wash:#34191a; --warn:#f2b45a; --warn-wash:#302311; --ok:#6fd49a; --ok-wash:#132a1d; --info:#7db6f5; --info-wash:#132438;
  --g-total:#a690ff; --g-b2b:#ff9d55; --g-race:#67b5ff; --g-b2c:#78d685; --g-admin:#e5c24f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 20px -8px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.3); --shadow-3:0 28px 56px -16px rgba(0,0,0,.75);
  --spot:radial-gradient(70% 120% at 12% -10%,rgba(240,164,58,.24),rgba(240,164,58,0) 62%);
  color-scheme:dark}

/* ---------- 基礎 ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-strong) transparent}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);line-height:1.6;-webkit-font-smoothing:antialiased;caret-color:var(--amber)}
::selection{background:var(--amber);color:var(--on-amber)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;letter-spacing:.01em}
p{margin:0;text-wrap:pretty}
a{color:var(--amber-ink);text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:var(--r-sm)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:60;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:var(--r-md);transition:top var(--t2) var(--ease)}
.skip:focus{top:12px}
svg.i{width:20px;height:20px;flex:none;display:block}
svg.i.sm{width:16px;height:16px}

/* ---------- 外框：側欄＋主欄 ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh;background:linear-gradient(90deg,var(--panel-2) var(--side),transparent 0)}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5) var(--s4) var(--s4);padding-left:max(var(--s4),env(safe-area-inset-left,0px));background:var(--panel-2);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2)}
.brand .mark{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--ink);color:var(--panel)}
.brand b{display:block;font-size:var(--fs-md)}
.brand span{display:block;font-size:var(--fs-xs);color:var(--ink-3)}
.nav{display:grid;gap:2px;list-style:none;margin:0;padding:0}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 var(--s3);border-radius:var(--r-md);color:var(--ink-2);text-decoration:none;transition:background var(--t1),color var(--t1)}
.nav a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:var(--shadow-1)}
.nav a[aria-current="page"] svg{color:var(--amber-ink)}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink-3)}
.nav .key{font-family:var(--mono);font-size:11px;color:var(--ink-3);opacity:0;transition:opacity var(--t1)}
.nav:hover .key{opacity:1}
.side-foot{margin-top:auto;display:grid;gap:var(--s3)}
.curtain{padding:var(--s4);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-1);border:1px solid var(--line)}
.curtain .d{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;color:var(--ink)}
.curtain .d small{font-family:var(--sans);font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);margin-left:4px}
.curtain p{font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px}
.themes{display:flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line)}
.themes button{flex:1;display:grid;place-items:center;min-height:34px;border:0;background:none;border-radius:7px;color:var(--ink-3)}
.themes button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);box-shadow:var(--shadow-1)}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s3) var(--s6);background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color var(--t2)}
.topbar.stuck{border-bottom-color:var(--line)}
.topbar h1{font-size:var(--fs-xl);font-weight:700}
.topbar .meta{font-size:var(--fs-xs);color:var(--ink-3)}
.topbar .tools{margin-left:auto;display:flex;gap:var(--s2)}
.mtitle{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-size:var(--fs-sm);font-weight:500;box-shadow:var(--shadow-1);transition:background var(--t1),border-color var(--t1),transform var(--t1)}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.icon{width:40px;padding:0}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--amber))}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
main{flex:1;padding:var(--s2) var(--s6) var(--s7)}
main:focus{outline:none}
.view{max-width:1240px;display:grid;gap:var(--s5)}
.view.enter{animation:viewIn var(--t3) var(--ease)}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}}
footer.site{padding:var(--s5) var(--s6) var(--s6);font-size:var(--fs-xs);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 16px}

/* ---------- 面板與標題 ---------- */
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s4);padding:var(--s4) var(--s5) var(--s3)}
.panel-h h2{font-size:var(--fs-lg);font-weight:700}
.panel-h .sub{font-size:var(--fs-sm);color:var(--ink-3)}
.panel-b{padding:0 var(--s5) var(--s5)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:var(--fs-sm);font-weight:500;color:var(--amber-ink);text-decoration:none;border:0;background:none;padding:0 4px;border-radius:var(--r-sm)}
.linkbtn:hover{text-decoration:underline}
.linkbtn svg{transition:transform var(--t2) var(--ease)}
.linkbtn:hover svg{transform:translateX(3px)}
.cols{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.stack{display:grid;gap:var(--s5);align-content:start}
.lead-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2) var(--s4)}
.lead-h h2{font-size:var(--fs-2xl);font-weight:700}
.lead-h p{color:var(--ink-3);font-size:var(--fs-sm)}

/* ---------- 總覽：簡報（唯一的舞台燈） ---------- */
.brief{position:relative;overflow:hidden;padding:var(--s6) var(--s6) var(--s5);border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-2);isolation:isolate}
.brief::before{content:"";position:absolute;inset:0;background:var(--spot);z-index:-1;transform-origin:12% 0}
.brief.lit::before{animation:lamp 900ms var(--ease) both}
@keyframes lamp{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.brief .count{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.brief .big{font-family:var(--serif);font-weight:900;font-size:var(--fs-display);line-height:.95;letter-spacing:-.01em}
.brief .unit{font-size:var(--fs-lg);font-weight:700}
.brief .when{font-size:var(--fs-sm);color:var(--ink-2)}
.brief .lede{margin-top:var(--s3);font-size:var(--fs-md);max-width:62ch;color:var(--ink-2);line-height:1.75}
.brief .lede b{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5)}
.fact{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--ink);text-decoration:none;font-size:var(--fs-sm);transition:border-color var(--t1),background var(--t1),transform var(--t1)}
.fact:hover{border-color:var(--ink-3)}
.fact:active{transform:scale(.98)}
.fact b{font-family:var(--mono);font-size:var(--fs-md)}
.fact.bad{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-wash);color:var(--danger)}
.fact.warnf{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-wash);color:var(--warn)}
.fact svg{color:currentColor}

/* 提醒 */
.alert{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s5);border-radius:var(--r-lg);background:var(--warn-wash);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert p{color:var(--ink);font-size:var(--fs-sm)}
.alert b{color:var(--warn)}
.alert .act{margin-top:var(--s2)}

/* 下一關 */
.gate{padding:var(--s5)}
.gate .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4)}
.gate h3{font-size:var(--fs-xl);font-weight:700;margin-top:2px}
.gate .tag{font-size:var(--fs-xs);font-weight:700;color:var(--amber-ink)}
.gate .days{text-align:right;flex:none}
.gate .days b{display:block;font-family:var(--mono);font-size:var(--fs-2xl);line-height:1}
.gate .days span{font-size:var(--fs-xs);color:var(--ink-3)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s4);margin:var(--s4) 0 0;font-size:var(--fs-sm)}
dl.kv dt{color:var(--ink-3);white-space:nowrap}
dl.kv dd{margin:0}

/* ---------- 共用：組別、狀態 ---------- */
.grp{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap}
.grp::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gc);flex:none}
.st{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.4}
.st svg{width:14px;height:14px}
.st-todo{background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.st-now{background:var(--amber-wash);color:var(--amber-ink)}
.st-doing{background:var(--info-wash);color:var(--info)}
.st-done{background:var(--ok-wash);color:var(--ok)}
.st-late,.st-blocked{background:var(--danger-wash);color:var(--danger)}
.st-missing{background:none;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent)}
.owner-none{color:var(--warn);font-weight:500}

/* ---------- 工作清單（可展開） ---------- */
.tlist{list-style:none;margin:0;padding:0}
.tlist>li{border-top:1px solid var(--line)}
.tlist>li:first-child{border-top:0}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr) 124px 92px 118px 128px 20px;gap:var(--s3);align-items:center;width:100%;min-height:56px;padding:10px var(--s5);border:0;background:none;text-align:left;color:inherit;transition:background var(--t1)}
.trow:hover{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.trow[aria-expanded="true"]{background:var(--sunken)}
.trow .code{font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink-3)}
.trow .ttl{font-weight:500;min-width:0}
.trow .ttl small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .dates{font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink-2)}
.trow .dates small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.trow .stc{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}
.trow .mmeta{display:none}
.trow .chev{color:var(--ink-3);transition:transform var(--t2) var(--ease)}
.trow[aria-expanded="true"] .chev{transform:rotate(180deg)}
.trow.missing .ttl{color:var(--ink-2)}
.thead{display:grid;grid-template-columns:72px minmax(0,1fr) 124px 92px 118px 128px 20px;gap:var(--s3);padding:8px var(--s5);font-size:var(--fs-xs);color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--sunken);border-radius:var(--r-lg) var(--r-lg) 0 0}
.tdetail{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t3) var(--ease)}
.tdetail.open{grid-template-rows:1fr}
.tdetail>div{overflow:hidden;visibility:hidden;transition:visibility 0s var(--t3)}
.tdetail.open>div{visibility:visible;transition:visibility 0s}
.tdetail .in{padding:var(--s2) var(--s5) var(--s5) calc(72px + var(--s5) + var(--s3));display:grid;gap:var(--s3);font-size:var(--fs-sm)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink)}
.chipbtn:hover{border-color:var(--ink-3)}
.chipbtn[disabled]{opacity:.5;cursor:not-allowed}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,30%{background:var(--amber-wash)}}
.empty{display:grid;justify-items:center;gap:var(--s3);padding:var(--s7) var(--s5);text-align:center;color:var(--ink-2)}
.empty svg{width:28px;height:28px;color:var(--ink-3)}

/* 工作列依「所在面板寬度」切換版型 */
.tbox{container:tl / inline-size}
@container tl (max-width:1000px){
  .trow,.thead{grid-template-columns:64px minmax(0,1fr) 84px 108px 128px 20px}
  .trow .grpc,.thead .grpc{display:none}
}
@container tl (max-width:780px){
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) 20px;grid-template-areas:"ttl chev" "meta meta";gap:6px var(--s2);padding:var(--s3) var(--s4)}
  .trow .code{display:none}
  .trow .ttl{grid-area:ttl}
  .trow .chev{grid-area:chev}
  .trow .mmeta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--fs-xs);color:var(--ink-3)}
  .trow .grpc,.trow .ownc,.trow .dates,.trow .stc{display:none}
  .tdetail .in{padding:0 var(--s4) var(--s4)}
}
/* 工具列 */
.toolbar{display:grid;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.trow2{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center}
.search{position:relative;flex:1 1 260px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
input[type=search],select{width:100%;min-height:44px;font-size:16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:0 12px;transition:border-color var(--t1),box-shadow var(--t1)}
input[type=search]{padding-left:40px}
select{width:auto;min-width:150px;padding-right:32px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=search]:hover,select:hover{border-color:var(--ink-3)}
input[type=search]:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)}
input::placeholder{color:var(--ink-3)}

/* ---------- 時間軸 ---------- */

.gt{position:relative;min-height:34px}
.months{display:flex;height:100%}

.gg .gt{background:var(--sunken)}
.bar{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.dbar{position:absolute;top:0;bottom:0;width:5px;border-left:1px solid var(--ink-3);border-right:2px solid var(--ink-3);opacity:.55}
.gb{position:absolute;top:11px;height:12px;border-radius:3px;background:var(--gc);border:0;padding:0;transition:transform var(--t1),filter var(--t1)}
.gb:hover{transform:scaleY(1.35);filter:saturate(1.2)}
.gb.missing{background:repeating-linear-gradient(135deg,var(--gc) 0 3px,transparent 3px 7px);outline:1px solid var(--gc);outline-offset:-1px}
.gb.done{opacity:.35}
.gb.alertb{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--danger)}
.gms{position:absolute;top:11px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--ink);border-radius:2px}
.gms.past{background:var(--ink-3)}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--amber);z-index:1;pointer-events:none}

.agenda{list-style:none;margin:0;padding:0}

.agenda ul{list-style:none;margin:var(--s2) 0 0;padding:0;display:grid;gap:2px}
.agenda .ai{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:var(--r-md);background:none;text-align:left}
.agenda .ai:hover{background:var(--sunken)}
.agenda .ms-i{display:flex;gap:8px;align-items:center;padding:8px;font-size:var(--fs-sm);font-weight:700;color:var(--amber-ink)}

/* ---------- 里程碑 ---------- */
.gates{list-style:none;margin:0;padding:0;counter-reset:g}

.plan .lab b{font-family:var(--mono)}
.track{position:relative;height:14px;border-radius:4px;background:var(--sunken);border:1px solid var(--line)}
.fill{position:absolute;left:0;top:-1px;bottom:-1px;border-radius:4px;background:var(--ink-3)}
.fill.rec{background:var(--amber)}
.fill.lean{background:repeating-linear-gradient(135deg,var(--amber) 0 4px,color-mix(in srgb,var(--amber) 35%,transparent) 4px 8px)}
.target{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
table.inc{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.inc th{text-align:left;font-size:var(--fs-xs);font-weight:500;color:var(--ink-3);padding:8px var(--s5);border-bottom:1px solid var(--line);background:var(--sunken)}
.inc td{padding:12px var(--s5);border-bottom:1px solid var(--line);vertical-align:top}

.inc th.amt{text-align:right}
.inc .note{color:var(--ink-3);font-size:var(--fs-xs);max-width:52ch}

/* ---------- 上手 ---------- */
ol.steps{list-style:none;margin:0;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:36px minmax(0,1fr);gap:var(--s3);padding:var(--s4) var(--s5);border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(st);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--panel);font-family:var(--mono);font-weight:600}
ol.steps b{display:block}
ol.steps span{color:var(--ink-2);font-size:var(--fs-sm)}
dl.gloss{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px var(--s4);margin:0;padding:0 var(--s5) var(--s5);font-size:var(--fs-sm)}
dl.gloss dt{font-weight:700}
dl.gloss dd{margin:0;color:var(--ink-2)}
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.docs a{display:flex;gap:var(--s3);align-items:flex-start;min-height:64px;padding:var(--s4) var(--s5);color:var(--ink);text-decoration:none;border-top:1px solid var(--line);transition:background var(--t1)}
.docs a:hover{background:var(--sunken)}
.docs a svg{color:var(--ink-3);margin-top:2px}
.docs small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.prose{padding:0 var(--s5) var(--s5);display:grid;gap:var(--s3);max-width:70ch}
.prose p{color:var(--ink-2)}

/* 進度表（各組） */
.gtable{display:grid}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr) 64px 92px;gap:var(--s4);align-items:center;min-height:52px;padding:6px var(--s5);border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.prog{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunken);border:1px solid var(--line)}
.prog i{display:block;height:100%}
.grow .n{font-family:var(--mono);font-size:var(--fs-sm);text-align:right}
.grow .m{font-size:var(--fs-xs);color:var(--warn);text-align:right}

/* ---------- 手機底部分頁與更多 ---------- */
.tabbar{display:none}
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-3)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:var(--fs-sm);box-shadow:var(--shadow-3);transition:opacity var(--t2),transform var(--t2) var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

<script>
const DATA = /*__DATA__*/null;
const ICONS = /*__ICONS__*/{};
(function(){
"use strict";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ic=(n,cls)=>`<svg class="i ${cls||""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[n]||""}</svg>`;
document.querySelectorAll("[data-icon]").forEach(el=>{el.innerHTML=ic(el.dataset.icon);});
const main=document.getElementById("main");
if(!DATA||!Array.isArray(DATA.tasks)){main.innerHTML=`<div class="alert" role="alert">${ic("danger-triangle-linear")}<p><b>資料沒有載入。</b>這份頁面缺少活動總表的資料，請請總召重新產生。</p></div>`;return;}

/* ---------- 主題 ---------- */
const THEME_ICON={light:"sun-2-linear",system:"monitor-linear",dark:"moon-linear"};
document.querySelectorAll("[data-theme-set]").forEach(b=>b.innerHTML=ic(THEME_ICON[b.dataset.themeSet],"sm"));
function applyTheme(t){if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===t)));try{localStorage.setItem("dash-theme",t);}catch(e){}}
let theme="system";try{theme=localStorage.getItem("dash-theme")||"system";}catch(e){}
applyTheme(theme);
document.addEventListener("click",e=>{const b=e.target.closest("[data-theme-set]");if(b)applyTheme(b.dataset.themeSet);});

/* ---------- 資料 ---------- */
const GROUPS=[{name:"總召、副召",short:"總召",c:"var(--g-total)"},{name:"廠商對接 B2B",short:"B2B",c:"var(--g-b2b)"},{name:"賽事運行",short:"賽事",c:"var(--g-race)"},{name:"行銷公關 B2C",short:"B2C",c:"var(--g-b2c)"},{name:"事務行政",short:"事務",c:"var(--g-admin)"}];
const GC=n=>{const g=GROUPS.find(g=>n&&n.indexOf(g.name)===0)||GROUPS.find(g=>n&&n.includes(g.short));return g?g.c:"var(--ink-3)";};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const day=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
const DAY=864e5,diff=(a,b)=>Math.round((a-b)/DAY);
const md=s=>{const d=day(s);return d?`${d.getMonth()+1}/${d.getDate()}`:"—";};
const money=n=>"NT$"+Math.round(n).toLocaleString("en-US");
const tasks=DATA.tasks.map(t=>{const s=day(t.start),e=day(t.end);let k;
  if(t.status==="完成")k="done";else if(t.status==="卡住")k="blocked";else if(e&&e<today)k="late";
  else if(s&&s<=today)k=t.status==="進行中"?"doing":"now";else k=t.status==="進行中"?"doing":"todo";
  return Object.assign({},t,{k,s,e});});
const byCode=Object.fromEntries(tasks.map(t=>[t.code,t]));
const KL={done:"完成",blocked:"卡住",late:"逾期",now:"該開始了",doing:"進行中",todo:"未開始"};
const KI={done:"check-circle-linear",blocked:"danger-triangle-linear",late:"alarm-linear",now:"clock-circle-linear",doing:"clock-circle-linear",todo:"clock-circle-linear"};
const stc=t=>`<span class="st st-${t.k}">${ic(KI[t.k])}${KL[t.k]}</span>`+(t.missing?`<span class="st st-missing" title="原規劃有這項工作，但活動總表目前沒有">總表缺漏</span>`:"");
const grp=g=>`<span class="grp" style="--gc:${GC(g)}">${esc(g)}</span>`;
const evStart=day(DATA.eventStart),evEnd=day(DATA.eventEnd);
const pendDec=DATA.decisions.filter(d=>d.type!=="已確認");

/* ---------- 導覽 ---------- */
const VIEWS=[
  {id:"overview",l:"總覽",i:"widget-5-linear",d:"今天該知道的事"},
  {id:"timeline",l:"時間軸",i:"calendar-linear",d:"2026/11 – 2027/05 全部工作"},
  {id:"tasks",l:"工作",i:"checklist-minimalistic-linear",n:tasks.length,d:"篩選、搜尋每一項工作"},
  {id:"milestones",l:"關卡",i:"flag-linear",n:DATA.milestones.length,d:"沒過就不往下走的 13 個日期"},
  {id:"decisions",l:"待決事項",i:"chat-square-check-linear",n:pendDec.length,d:"幹部會議要拍板的事"},
  {id:"people",l:"組別與人員",i:"users-group-rounded-linear",d:"誰負責什麼"},
  {id:"budget",l:"經費",i:"wallet-money-linear",d:"支出、收入與缺口"},
  {id:"start",l:"新手上手",i:"compass-linear",d:"第一次接手從這裡開始"}];
const navItem=(v,i,withKey)=>`<li><a href="#${v.id}" data-v="${v.id}">${ic(v.i)}<span>${v.l}</span>${v.n!=null?`<span class="cnt">${v.n}</span>`:withKey?`<span class="key">${i+1}</span>`:""}</a></li>`;
document.getElementById("sidenav").innerHTML=VIEWS.map((v,i)=>navItem(v,i,true)).join("");
document.getElementById("morenav").innerHTML=VIEWS.slice(4).map((v,i)=>navItem(v,i+4,false)).join("");
const tabbar=document.getElementById("tabbar");
tabbar.innerHTML=VIEWS.slice(0,4).map(v=>`<a href="#${v.id}" data-v="${v.id}">${ic(v.i)}<span>${v.l}</span></a>`).join("")+`<button type="button" id="more-open" aria-haspopup="dialog" aria-expanded="false" aria-controls="more">${ic("menu-dots-linear")}<span>更多</span></button>`;
const more=document.getElementById("more"),moreOpen=document.getElementById("more-open");
document.getElementById("more-close").innerHTML=ic("close-circle-linear");
moreOpen.addEventListener("click",()=>{more.showModal();moreOpen.setAttribute("aria-expanded","true");});
more.addEventListener("close",()=>moreOpen.setAttribute("aria-expanded","false"));
document.getElementById("more-close").addEventListener("click",()=>more.close());
more.addEventListener("click",e=>{if(e.target===more||e.target.closest("a"))more.close();});
document.getElementById("btn-search").innerHTML=ic("magnifer");

/* 倒數 */
const left=diff(evStart,today);
document.getElementById("curtain").innerHTML=left>=0?`<div class="d">${left}<small>天</small></div><p>距活動第一天 ${md(DATA.eventStart)}（日期待確認）</p>`:`<div class="d">已結束</div>`;
document.getElementById("foot").innerHTML=`<span>資料快照 ${esc(DATA.snapshot)}，來源：本活動_活動總表_v2。本頁唯讀，進度請改活動總表。</span><span>本頁不含電話、Email 等個資。</span><span>圖示：Solar Icons（480 Design，CC BY 4.0）</span>`;

/* ---------- 狀態 ---------- */
const state={group:"全部",status:"全部",q:"",owner:"",sort:"end",tview:""};
try{Object.assign(state,JSON.parse(localStorage.getItem("dash-filter")||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem("dash-filter",JSON.stringify(state));}catch(e){}};
const toast=(msg,icon)=>{const t=document.getElementById("toast");t.innerHTML=(icon?ic(icon,"sm"):"")+esc(msg);t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200);};
let pendingFocus=null;

/* ---------- 路由 ---------- */
function current(){const v=(location.hash||"#overview").slice(1);return VIEWS.some(x=>x.id===v)?v:"overview";}
function go(v){if(current()===v&&location.hash)route();else location.hash=v;}
let first=true;
function route(){
  const v=current(),meta=VIEWS.find(x=>x.id===v);
  document.querySelectorAll("[data-v]").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("vtitle").textContent=meta.l;
  document.getElementById("vmeta").textContent=meta.d+`｜快照 ${DATA.snapshot}`;
  document.title=`${meta.l}｜本活動專案中控台`;
  const pf=pendingFocus;
  main.innerHTML=`<div class="view${RM||first?"":" enter"}">${R[v]()}</div>`;
  if(!first){window.scrollTo({top:0});if(!pf)main.focus({preventScroll:true});}
  (A[v]||(()=>{}))();
  first=false;
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,select,textarea,dialog")||e.metaKey||e.ctrlKey||e.altKey)return;
  const n=+e.key;if(n>=1&&n<=VIEWS.length){go(VIEWS[n-1].id);}
  if(e.key==="/"){e.preventDefault();openSearch();}
});
function openSearch(){if(current()!=="tasks"){pendingFocus="q";go("tasks");}else document.getElementById("q")?.focus();}
document.getElementById("btn-search").addEventListener("click",openSearch);
document.getElementById("btn-copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(location.href);toast("已複製這頁的連結","check-circle-linear");}
  catch(e){toast("無法自動複製，請從瀏覽器網址列複製","danger-triangle-linear");}});
const topbar=document.getElementById("topbar");
addEventListener("scroll",()=>topbar.classList.toggle("stuck",scrollY>4),{passive:true});
function jump(filter){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""},filter);save();go("tasks");}
function showTask(code){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""});save();pendingFocus="task:"+code;go("tasks");}
main.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();jump(JSON.parse(j.dataset.jump));return;}
  const t=e.target.closest("[data-task]");if(t){e.preventDefault();showTask(t.dataset.task);}
});

const R={},A={};
const panelH=(h,sub,right)=>`<div class="panel-h"><div><h2>${h}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div>${right||""}</div>`;
const more_=(href,label)=>`<a class="linkbtn" href="${href}">${label}${ic("arrow-right-linear","sm")}</a>`;

/* ---------- 總覽 ---------- */
R.overview=()=>{
  const done=tasks.filter(t=>t.k==="done").length,late=tasks.filter(t=>t.k==="late").length,blocked=tasks.filter(t=>t.k==="blocked").length;
  const un=tasks.filter(t=>!t.owner&&t.k!=="done").length;
  const wk=new Date(+today+7*DAY),week=tasks.filter(t=>t.k!=="done"&&t.s&&t.s<=wk&&t.e>=today).sort((a,b)=>a.e-b.e);
  const weekUn=week.filter(t=>!t.owner).length;
  const nx=DATA.milestones.find(m=>day(m.date)>=today&&m.status!=="完成");
  const dec=pendDec.filter(d=>d.due).sort((a,b)=>day(a.due)-day(b.due));
  const b=DATA.budget,conf=b.income.filter(i=>i.status==="已確認").reduce((s,i)=>s+i.amount,0);
  const lede=[nx?`下一關是<b>「${esc(nx.title)}」</b>，${md(nx.date)} 截止，還有 ${diff(day(nx.date),today)} 天。`:"",
    week.length?`未來 7 天有 <b>${week.length} 件工作</b>要動${weekUn?`，其中 ${weekUn} 件還沒有負責人`:""}。`:"未來 7 天沒有排定的工作。",
    `經費目前已確認 ${money(conf)}，缺口 <b>${money(b.gapConfirmed[2])}</b>。`].join("");
  const fact=(cls,icon,label,val,f)=>`<a class="fact ${cls}" href="#tasks" data-jump='${JSON.stringify(f)}'>${ic(icon,"sm")}${label} <b>${val}</b></a>`;
  return `
  <section class="brief" id="brief" aria-label="今日簡報">
    <div class="count"><span class="big num">${Math.max(left,0)}</span><span class="unit">天後開演</span><span class="when">活動第一天 ${md(DATA.eventStart)}（日期待確認）</span></div>
    <p class="lede">${lede}</p>
    <div class="facts">
      ${fact("","check-circle-linear","完成",`${done}／${tasks.length}`,{status:"完成"})}
      ${fact(late?"bad":"","alarm-linear","逾期",late,{status:"逾期"})}
      ${fact(blocked?"bad":"","danger-triangle-linear","卡住",blocked,{status:"卡住"})}
      ${fact(un?"warnf":"","user-cross-linear","未指派",un,{owner:"__none",status:"待處理"})}
    </div>
  </section>
  ${DATA.missingCount?`<div class="alert">${ic("danger-triangle-linear")}<div><p><b>活動總表少了 ${DATA.missingCount} 項工作。</b>總表目前只有 ${DATA.sheetCount} 項；總召、賽事、B2C 的工作全部不在表裡，B2B 與事務行政也少了幾項。這些工作在本頁以虛線標成「總表缺漏」，請總召確認後補回活動總表。</p>
    <div class="act"><a class="linkbtn" href="#tasks" data-jump='{"status":"總表缺漏"}'>看 ${DATA.missingCount} 項缺漏工作${ic("arrow-right-linear","sm")}</a></div></div></div>`:""}
  <div class="cols">
    <section class="panel" aria-labelledby="h-week">${panelH(`<span id="h-week">未來 7 天要動的工作</span>`,`依截止日排序，共 ${week.length} 項`,more_("#tasks","全部工作"))}
      ${week.length?`<div class="tbox"><ul class="tlist">${week.map(t=>`<li>${taskRow(t,false)}</li>`).join("")}</ul></div>`:`<div class="empty">${ic("check-circle-linear")}<p>未來 7 天沒有排定的工作。</p></div>`}</section>
    <div class="stack">
      ${nx?`<section class="panel gate" aria-labelledby="h-gate"><div class="row1"><div><p class="tag">下一關</p><h3 id="h-gate">${esc(nx.title)}</h3></div><div class="days"><b>${diff(day(nx.date),today)}</b><span>天後｜${md(nx.date)}</span></div></div>
        <dl class="kv"><dt>通過條件</dt><dd>${esc(nx.cond)}</dd><dt>沒過怎麼辦</dt><dd>${esc(nx.fallback)}</dd><dt>主責</dt><dd>${grp(nx.group)}</dd></dl>
        <div style="margin-top:12px">${more_("#milestones","13 個關卡")}</div></section>`:""}
      <section class="panel" aria-labelledby="h-dec">${panelH(`<span id="h-dec">最近要拍板</span>`,"",more_("#decisions",`全部 ${pendDec.length} 項`))}
        <ul class="dlist">${dec.slice(0,4).map(d=>`<li style="grid-template-columns:minmax(0,1fr) auto;padding:12px 24px"><div><div class="q">${esc(d.q)}</div><div class="rec">建議：${esc(d.rec)}</div></div><div class="due">${md(d.due)}</div></li>`).join("")}</ul></section>
    </div>
  </div>
  <section class="panel" aria-labelledby="h-grp">${panelH(`<span id="h-grp">各組進度</span>`,"點組名看該組全部工作",`<span class="legend"><span><i style="width:10px;height:10px;border-radius:2px;background:var(--ok)"></i>完成</span><span><i style="width:10px;height:10px;border-radius:2px;background:var(--info)"></i>進行中、該開始</span><span><i style="width:10px;height:10px;border-radius:2px;background:var(--danger)"></i>逾期、卡住</span></span>`)}
    <div class="gtable">${GROUPS.map(g=>{const ts=tasks.filter(t=>t.group===g.name);if(!ts.length)return"";const c=k=>ts.filter(t=>k.includes(t.k)).length/ts.length*100,miss=ts.filter(t=>t.missing).length,dn=ts.filter(t=>t.k==="done").length;
      return `<div class="grow"><a class="gname linkbtn" style="color:var(--ink)" href="#tasks" data-jump='${JSON.stringify({group:g.name})}'>${grp(g.name)}</a>
        <div class="prog" role="img" aria-label="${esc(g.name)}：完成 ${dn} 項，共 ${ts.length} 項"><i style="width:${c(["done"])}%;background:var(--ok)"></i><i style="width:${c(["doing","now"])}%;background:var(--info)"></i><i style="width:${c(["late","blocked"])}%;background:var(--danger)"></i></div>
        <span class="n">${dn}/${ts.length}</span><span class="m">${miss?`缺漏 ${miss} 項`:""}</span></div>`;}).join("")}</div></section>`;
};
A.overview=()=>{if(!RM&&!A.overview._lit){const b=document.getElementById("brief");b&&b.classList.add("lit");A.overview._lit=1;}};

/* ---------- 工作列 ---------- */
function taskRow(t,expandable){
  const rem=t.k==="late"?`逾期 ${diff(today,t.e)} 天`:(t.e?`剩 ${diff(t.e,today)} 天`:"");
  const owner=t.owner?esc(t.owner):`<span class="owner-none">未指派</span>`;
  const inner=`<span class="code">${esc(t.code)}</span>
    <span class="ttl">${esc(t.title)}${t.note?`<small>${esc(t.note)}</small>`:""}</span>
    <span class="grpc">${grp(t.group)}</span><span class="ownc">${owner}</span>
    <span class="dates">${md(t.start)} → ${md(t.end)}${t.k!=="done"&&rem?`<small>${rem}</small>`:""}</span>
    <span class="stc">${stc(t)}</span>
    <span class="mmeta">${stc(t)}<span>${owner}</span><span class="num">${md(t.start)}→${md(t.end)}</span>${t.k!=="done"&&rem?`<span>${rem}</span>`:""}</span>
    <span class="chev">${ic(expandable?"alt-arrow-down-linear":"arrow-right-linear","sm")}</span>`;
  return expandable
    ?`<button type="button" class="trow${t.missing?" missing":""}" id="row-${esc(t.code)}" aria-expanded="false" aria-controls="det-${esc(t.code)}" data-row="${esc(t.code)}">${inner}</button>
      <div class="tdetail" id="det-${esc(t.code)}" role="region" aria-label="${esc(t.title)} 詳細"><div><div class="in">${detail(t)}</div></div></div>`
    :`<a class="trow${t.missing?" missing":""}" href="#tasks" data-task="${esc(t.code)}" style="text-decoration:none">${inner}</a>`;
}
function detail(t){
  const pres=(t.pre||"").split(/[,，、\s]+/).filter(Boolean);
  const after=tasks.filter(x=>(x.pre||"").split(/[,，、\s]+/).includes(t.code));
  const chip=c=>byCode[c]?`<button type="button" class="chipbtn" data-goto="${esc(c)}">${esc(c)} ${esc(byCode[c].title)}</button>`:`<button type="button" class="chipbtn" disabled title="這個編號在資料中找不到">${esc(c)}（找不到）</button>`;
  return `<dl class="kv" style="margin:0">
    <dt>負責</dt><dd>${grp(t.group)}　${t.owner?esc(t.owner):'<span class="owner-none">還沒指派個人</span>'}</dd>
    <dt>期間</dt><dd class="num">${md(t.start)} → ${md(t.end)}（${t.s&&t.e?diff(t.e,t.s)+1:"—"} 天）</dd>
    ${t.note?`<dt>備註</dt><dd>${esc(t.note)}</dd>`:""}
    ${t.missing?`<dt>資料</dt><dd style="color:var(--warn)">原規劃有這項工作，但活動總表目前沒有。請總召確認後補回總表。</dd>`:""}</dl>
    ${pres.length?`<div><p style="font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px">要先完成</p><div class="chips">${pres.map(chip).join("")}</div></div>`:""}
    ${after.length?`<div><p style="font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px">完成後才能開始</p><div class="chips">${after.map(x=>chip(x.code)).join("")}</div></div>`:""}`;
}

/* ---------- 工作 ---------- */
const STATUS=["全部","待處理","逾期","卡住","完成","總表缺漏"];
function matches(t){const q=state.q.trim().toLowerCase();
  return (state.group==="全部"||t.group===state.group)
    &&(state.status==="全部"||(state.status==="待處理"&&t.k!=="done")||(state.status==="逾期"&&t.k==="late")||(state.status==="卡住"&&t.k==="blocked")||(state.status==="完成"&&t.k==="done")||(state.status==="總表缺漏"&&t.missing))
    &&(!state.owner||(state.owner==="__none"?!t.owner:t.owner===state.owner))
    &&(!q||(t.code+t.title+t.note+t.owner+t.group).toLowerCase().includes(q));}
const activeFilters=()=>(state.group!=="全部")+(state.status!=="全部")+(!!state.owner)+(!!state.q.trim());
R.tasks=()=>{const owners=[...new Set(tasks.map(t=>t.owner).filter(Boolean))];
  const gseg=`<div class="seg" role="group" aria-label="組別">${["全部",...GROUPS.map(g=>g.name)].map(n=>`<button type="button" data-g="${esc(n)}" aria-pressed="${state.group===n}">${n==="全部"?"全部組別":esc(GROUPS.find(g=>g.name===n).short)}</button>`).join("")}</div>`;
  const sseg=`<div class="seg" role="group" aria-label="狀態">${STATUS.map(s=>`<button type="button" data-st="${s}" aria-pressed="${state.status===s}">${s}<span class="n">${tasks.filter(t=>s==="全部"||(s==="待處理"&&t.k!=="done")||(s==="逾期"&&t.k==="late")||(s==="卡住"&&t.k==="blocked")||(s==="完成"&&t.k==="done")||(s==="總表缺漏"&&t.missing)).length}</span></button>`).join("")}</div>`;
  return `<section class="panel" aria-label="工作清單">
    <div class="toolbar">
      <div class="trow2">
        <div class="search">${ic("magnifer","sm")}<label class="sr" for="q">搜尋工作</label><input type="search" id="q" placeholder="搜尋工作名稱、編號、負責人" value="${esc(state.q)}" autocomplete="off"></div>
        <button type="button" class="btn filterbtn" id="fbtn" aria-expanded="false" aria-controls="filters">${ic("filter-linear","sm")}篩選<span class="num" id="fcount"></span></button>
      </div>
      <div class="filters trow2" id="filters">
        ${gseg}${sseg}
        <label class="sr" for="owner">負責人</label><select id="owner"><option value="">所有負責人</option>${owners.map(o=>`<option ${state.owner===o?"selected":""}>${esc(o)}</option>`).join("")}<option value="__none" ${state.owner==="__none"?"selected":""}>未指派</option></select>
        <label class="sr" for="sort">排序</label><select id="sort"><option value="end" ${state.sort==="end"?"selected":""}>依截止日</option><option value="start" ${state.sort==="start"?"selected":""}>依開始日</option><option value="code" ${state.sort==="code"?"selected":""}>依編號</option></select>
      </div>
      <div class="result"><span id="tcount" aria-live="polite"></span><button type="button" class="btn ghost" id="clear" hidden>${ic("close-circle-linear","sm")}清除篩選</button></div>
    </div>
    <div class="tbox"><div class="thead" aria-hidden="true"><span>編號</span><span>工作</span><span class="grpc">組別</span><span>負責人</span><span>日期</span><span>狀態</span><span></span></div>
    <ul class="tlist" id="tlist"></ul></div></section>`;};
A.tasks=()=>{
  const list=document.getElementById("tlist"),cnt=document.getElementById("tcount"),clear=document.getElementById("clear"),fc=document.getElementById("fcount");
  const sorters={end:(a,b)=>a.e-b.e||a.code.localeCompare(b.code),start:(a,b)=>a.s-b.s||a.e-b.e,code:(a,b)=>a.code.localeCompare(b.code,"zh-Hant",{numeric:true})};
  const draw=()=>{const L=tasks.filter(matches).sort(sorters[state.sort]||sorters.end);
    list.innerHTML=L.length?L.map(t=>`<li>${taskRow(t,true)}</li>`).join(""):`<li><div class="empty">${ic("magnifer")}<p>沒有符合條件的工作。</p><button type="button" class="btn" data-clear>清除篩選</button></div></li>`;

    const r=e.target.closest("[data-row]");if(r){const o=r.getAttribute("aria-expanded")!=="true";r.setAttribute("aria-expanded",String(o));document.getElementById("det-"+r.dataset.row).classList.toggle("open",o);}
  });
  function openRow(code,fromChip){let r=document.getElementById("row-"+code);
    if(!r){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""});save();main.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g==="全部"));main.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.st==="全部"));document.getElementById("q").value="";document.getElementById("owner").value="";draw();r=document.getElementById("row-"+code);}
    if(!r)return;r.setAttribute("aria-expanded","true");document.getElementById("det-"+code).classList.add("open");

  draw();
  if(pendingFocus==="q"){document.getElementById("q").focus();}
  else if(pendingFocus&&pendingFocus.startsWith("task:")){const c=pendingFocus.slice(5);requestAnimationFrame(()=>openRow(c));}

A.timeline=()=>{
  const tv=state.tview||(matchMedia("(max-width:767px)").matches?"list":"gantt"),el=document.getElementById("tl");
  const ts=GROUPS.filter(g=>state.group==="全部"||state.group===g.name);
  if(tv==="gantt"){
    const start=new Date(2026,10,1),end=new Date(2027,5,1),span=end-start,x=d=>Math.max(0,Math.min(100,(d-start)/span*100));
    const months=[];for(let d=new Date(start);d<end;d.setMonth(d.getMonth()+1))months.push(d.getMonth()+1+"月"+(d.getMonth()===0?` ${d.getFullYear()}`:""));
    const bars=months.map((_,i)=>`<div class="bar" style="left:${i/months.length*100}%"></div>`).join("")+`<div class="dbar" style="left:${x(evStart)}%"></div>`;
    const on=today>=start&&today<end,ph=on?`<div class="playhead" style="left:${x(today)}%"></div>`:"",phL=on?`<div class="playhead" style="left:${x(today)}%"><span>今天 ${today.getMonth()+1}/${today.getDate()}</span></div>`:"";
    let h=`<div class="gh"><div class="gl">工作</div><div class="gt"><div class="months">${months.map(m=>`<span>${m}</span>`).join("")}</div></div></div>`;
    h+=`<div class="gr gg"><div class="gl">關卡</div><div class="gt">${bars}${DATA.milestones.map(m=>`<span class="gms${day(m.date)<today?" past":""}" style="left:${x(day(m.date))}%" title="${esc(`${m.code} ${m.title}｜${md(m.date)}`)}"></span>`).join("")}${phL}</div></div>`;
    ts.forEach(g=>{const L=tasks.filter(t=>t.group===g.name).sort((a,b)=>a.s-b.s);if(!L.length)return;
      h+=`<div class="gr gg"><div class="gl">${grp(g.name)}<span class="num" style="margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-3)">${L.length}</span></div><div class="gt" style="min-height:30px">${bars}${ph}</div></div>`;
      L.forEach(t=>{const l=x(t.s),w=Math.max(.7,x(new Date(+t.e+DAY))-l),lab=`${t.code} ${t.title}，${md(t.start)} 到 ${md(t.end)}，${t.owner||"未指派"}，${KL[t.k]}${t.missing?"，總表缺漏":""}`;
        h+=`<div class="gr"><div class="gl"><button type="button" data-task="${esc(t.code)}" title="${esc(t.title)}"><span class="code">${esc(t.code)}</span><span class="nm">${esc(t.title)}</span></button></div><div class="gt">${bars}
          <button type="button" class="gb${t.missing?" missing":""}${t.k==="done"?" done":""}${t.k==="late"||t.k==="blocked"?" alertb":""}" style="--gc:${g.c};left:${l}%;width:${w}%" data-task="${esc(t.code)}" aria-label="${esc(lab)}" title="${esc(lab)}" tabindex="-1"></button>${ph}</div></div>`;});});
    el.innerHTML=`<div class="gwrap" tabindex="0" aria-label="甘特圖，可左右捲動"><div class="gantt">${h}</div></div>`;
    const w=el.querySelector(".gwrap");if(on&&w.scrollWidth>w.clientWidth){const pos=(x(today)/100)*(w.scrollWidth-250);w.scrollLeft=Math.max(0,pos-120);}
  }else{
    const ms=new Map();
    tasks.filter(t=>ts.some(g=>g.name===t.group)).sort((a,b)=>a.e-b.e).forEach(t=>{const k=`${t.e.getFullYear()}-${t.e.getMonth()}`;if(!ms.has(k))ms.set(k,{d:t.e,t:[],m:[]});ms.get(k).t.push(t);});
    DATA.milestones.forEach(m=>{const d=day(m.date),k=`${d.getFullYear()}-${d.getMonth()}`;if(!ms.has(k))ms.set(k,{d,t:[],m:[]});ms.get(k).m.push(m);});
    const keys=[...ms.keys()].sort((a,b)=>ms.get(a).d-ms.get(b).d);
    el.innerHTML=`<ul class="agenda">${keys.map(k=>{const o=ms.get(k);return `<li><h3>${o.d.getFullYear()} 年 ${o.d.getMonth()+1} 月<small>${o.t.length} 項到期</small></h3>
      ${o.m.map(m=>`<div class="ms-i">${ic("flag-linear","sm")}<span class="num">${md(m.date)}</span>關卡：${esc(m.title)}</div>`).join("")}
      <ul>${o.t.map(t=>`<li><button type="button" class="ai" data-task="${esc(t.code)}"><span class="num" style="font-size:12px;color:var(--ink-3)">${md(t.end)}</span><span style="min-width:0"><span style="display:block">${esc(t.title)}</span><span class="grp" style="--gc:${GC(t.group)};font-size:12px">${esc(t.owner||"未指派")}</span></span>${stc(t)}</button></li>`).join("")}</ul></li>`;}).join("")}</ul>`;
  }
  main.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{state.group=b.dataset.g;save();route();}));
  main.querySelectorAll("[data-tv]").forEach(b=>b.addEventListener("click",()=>{state.tview=b.dataset.tv;save();route();}));
};
