<title>本活動專案中控台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
/* Layout：一本每週出刊的音樂雜誌（Bloomberg Businessweek／Turley 時期的編輯式大膽風）。
   黑色報頭＋目錄式分頁；每一頁是一個跨頁：滿版訊號色開頭、超大標題、粗黑線分欄。
   每個跨頁只用 黑、白＋一個訊號色（黃／桃紅／電光藍）；圓角 0、不用柔和陰影，動態是「硬切」與「砸進定位」。 */
:root{
  --paper:#ffffff; --ink:#0b0b0b; --ink-2:#2e2e2e; --ink-3:#555555; --hair:#0b0b0b; --tint:#f1f1ee;
  --yellow:#ffe500; --pink:#ff2e88; --blue:#1a2bff;
  --on-yellow:#0b0b0b; --on-pink:#0b0b0b; --on-blue:#ffffff;
  --spread:var(--yellow); --on-spread:var(--on-yellow);
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --numeral:"Anton","Noto Sans TC",sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs-cap:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px; --fs-2xl:40px;
  --rule:3px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --slam:cubic-bezier(.2,1.7,.35,1); --cut:cubic-bezier(.7,0,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0b0b; --ink:#f4f2ea; --ink-2:#d6d3c9; --ink-3:#b0aca1; --hair:#f4f2ea; --tint:#1a1a18; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0b0b0b; --ink:#f4f2ea; --ink-2:#d6d3c9; --ink-3:#b0aca1; --hair:#f4f2ea; --tint:#1a1a18; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--ink) var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);line-height:1.6;-webkit-font-smoothing:antialiased;caret-color:var(--pink)}
::selection{background:var(--yellow);color:#0b0b0b}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.num{font-family:var(--numeral);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tab-num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:60;background:var(--yellow);color:#0b0b0b;padding:10px 14px;font-weight:700;border:var(--rule) solid #0b0b0b}
.skip:focus{top:12px}
svg.i{width:20px;height:20px;flex:none;display:block}
svg.i.sm{width:16px;height:16px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(var(--s5),env(safe-area-inset-left,0px));padding-right:max(var(--s5),env(safe-area-inset-right,0px))}

/* ---------- 報頭 ---------- */
.mast{background:#0b0b0b;color:#f4f2ea}
.mast .wrap{display:flex;align-items:center;gap:var(--s4);min-height:58px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo b{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-.02em;white-space:nowrap}
.logo span{font-family:var(--serif);font-size:var(--fs-cap);color:#cfcabd;white-space:nowrap}
.issue{font-family:var(--serif);font-size:var(--fs-cap);color:#cfcabd;white-space:nowrap;border-left:1px solid #555;padding-left:var(--s4)}
.mast .right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.cd{display:flex;align-items:baseline;gap:6px;background:var(--yellow);color:#0b0b0b;padding:2px 10px 0;margin-right:var(--s2);white-space:nowrap}
.cd .num{font-size:30px;line-height:1.1}
.cd small{font-weight:900;font-size:var(--fs-sm)}
.mbtn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;border:2px solid #f4f2ea;background:none;color:#f4f2ea;font-weight:700;font-size:var(--fs-sm);padding:0 8px}
.mbtn:hover{background:#f4f2ea;color:#0b0b0b}
.mbtn:active{transform:translate(1px,1px)}
.themes{display:flex;border:2px solid #f4f2ea}
.themes button{display:grid;place-items:center;min-width:36px;min-height:36px;border:0;background:none;color:#f4f2ea}
.themes button:hover{background:#333}
.themes button[aria-pressed="true"]{background:#f4f2ea;color:#0b0b0b}

/* 目錄式分頁（桌機） */
.side{border-bottom:var(--rule) solid var(--hair);background:var(--paper);position:sticky;top:0;z-index:20}
.side .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
.side .wrap::-webkit-scrollbar{display:none}
.nav{display:flex;list-style:none;margin:0;padding:0}
.nav li{display:flex}
.nav a{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 var(--s4);text-decoration:none;color:var(--ink);font-weight:700;font-size:var(--fs-base);white-space:nowrap;border-right:1px solid var(--hair)}
.nav li:first-child a{border-left:1px solid var(--hair)}
.nav a .key{font-family:var(--numeral);font-size:var(--fs-md);color:var(--ink-3)}
.nav a .cnt{font-family:var(--numeral);font-size:var(--fs-md)}
.nav a:hover{background:var(--ink);color:var(--paper)}
.nav a:hover .key{color:var(--paper)}
.nav a[aria-current="page"]{background:var(--spread);color:var(--on-spread)}
.nav a[aria-current="page"] .key{color:var(--on-spread)}
.nav a svg{display:none}

/* ---------- 跨頁開頭 ---------- */
.opener{position:relative;overflow:hidden;background:var(--spread);color:var(--on-spread);border-bottom:var(--rule) solid #0b0b0b}
.opener::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.18) 1.1px,transparent 1.3px);background-size:7px 7px;-webkit-mask-image:linear-gradient(115deg,transparent 40%,#000 90%);mask-image:linear-gradient(115deg,transparent 40%,#000 90%);pointer-events:none}
.opener .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:var(--s4) var(--s6);padding-top:var(--s6);padding-bottom:var(--s5)}
.opener h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,10vw,148px);letter-spacing:-.04em;line-height:.88}
.opener .cap{font-family:var(--serif);font-size:var(--fs-sm);max-width:34ch;margin-top:var(--s3)}
.opener .big{font-family:var(--numeral);font-size:clamp(88px,15vw,220px);line-height:.8;text-align:right}
.opener .big small{display:block;font-family:var(--display);font-weight:900;font-size:var(--fs-md);line-height:1.4;text-align:right}
.opener.cut{animation:wipe 260ms var(--cut) both}
.opener.cut h1,.opener.cut .big{animation:slam 420ms var(--slam) both}
.opener.cut .big{animation-delay:70ms}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes slam{from{transform:translateY(-28px) scale(1.04);opacity:0}}

main{padding-bottom:var(--s7);outline:none}
main:focus{outline:none}
.view{display:grid;gap:var(--s6);padding-top:var(--s6)}

/* ---------- 版面元件 ---------- */
.panel{min-width:0;border-top:var(--rule) solid var(--hair)}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2) var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--hair)}
.panel-h h2{font-family:var(--display);font-weight:900;font-size:var(--fs-xl);letter-spacing:-.02em}
.panel-h .sub{font-family:var(--serif);font-size:var(--fs-sm);color:var(--ink-2)}
.cols{display:grid;gap:var(--s6);grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.stack{display:grid;gap:var(--s6);align-content:start}
.pair{display:grid;gap:var(--s6);grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 2px;font-weight:900;font-size:var(--fs-sm);color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;border:0;background:none}
.linkbtn:hover{background:var(--ink);color:var(--paper);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:var(--fs-sm);text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform 60ms linear,box-shadow 60ms linear}
.btn:hover{background:var(--yellow);color:#0b0b0b}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.plain{box-shadow:none}
.grp{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;background:var(--ink);color:var(--paper);font-weight:700;font-size:var(--fs-cap);white-space:nowrap;letter-spacing:.02em}
.st{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;font-size:var(--fs-cap);font-weight:900;white-space:nowrap;border:2px solid var(--ink)}
.st svg{width:14px;height:14px}
.st-todo{background:var(--paper);color:var(--ink)}
.st-now{background:var(--yellow);color:#0b0b0b;border-color:#0b0b0b}
.st-doing{background:var(--blue);color:#fff;border-color:var(--blue)}
.st-done{background:var(--ink);color:var(--paper)}
.st-late,.st-blocked{background:var(--pink);color:#0b0b0b;border-color:#0b0b0b}
.st-missing{border-style:dashed;background:none;color:inherit;border-color:currentColor}
.owner-none{font-weight:900;text-decoration:underline wavy var(--pink) 2px;text-underline-offset:4px}
.empty{display:grid;justify-items:center;gap:var(--s3);padding:var(--s7) var(--s4);text-align:center;font-family:var(--serif)}
.empty svg{width:32px;height:32px}

/* ---------- 封面（總覽） ---------- */
.cover{position:relative;overflow:hidden;background:var(--yellow);color:#0b0b0b;border-bottom:var(--rule) solid #0b0b0b}
.cover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.15) 1.1px,transparent 1.3px);background-size:7px 7px;-webkit-mask-image:radial-gradient(80% 90% at 100% 0,#000,transparent 70%);mask-image:radial-gradient(80% 90% at 100% 0,#000,transparent 70%);pointer-events:none}
.cover .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--s5) var(--s7);padding-top:var(--s5);padding-bottom:var(--s5)}
.cover .hed{grid-column:1/-1;display:flex;align-items:flex-end;gap:var(--s2) var(--s4);flex-wrap:wrap}
.cover .n{font-family:var(--numeral);font-size:clamp(150px,27vw,380px);line-height:.76;margin-left:-.04em;text-shadow:6px 0 0 var(--pink),-5px 0 0 var(--blue)}
.cover .n.reg{animation:register 700ms var(--slam) both}
@keyframes register{0%{text-shadow:26px 0 0 var(--pink),-24px 0 0 var(--blue);transform:translateY(-14px)}60%{text-shadow:2px 0 0 var(--pink),-2px 0 0 var(--blue)}}
.cover .hed h1{font-family:var(--display);font-weight:900;font-size:clamp(44px,7vw,104px);letter-spacing:-.05em;line-height:.9;padding-bottom:.06em}
.cover .hed h1 .dek{display:block;font-size:max(16px,.24em);letter-spacing:0;margin-top:.6em;font-family:var(--serif);font-weight:700}
.coverlines{display:grid;align-content:start;border-top:var(--rule) solid #0b0b0b}
.cl{display:block;padding:var(--s3) 0;border-bottom:2px solid #0b0b0b;text-decoration:none;color:#0b0b0b}
.cl:hover{background:#0b0b0b;color:var(--yellow)}
.cl small{display:block;font-family:var(--serif);font-size:var(--fs-sm)}
.cl b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.03em;line-height:1.15}
.cl b .num{font-weight:400;letter-spacing:0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--rule) solid #0b0b0b;align-content:start}
.fact{display:grid;align-content:space-between;min-height:118px;padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:2px solid #0b0b0b;text-decoration:none;color:#0b0b0b}
.fact+.fact{padding-left:var(--s3);border-left:2px solid #0b0b0b}
.fact span{font-weight:900;font-size:var(--fs-sm);display:flex;align-items:center;gap:6px}
.fact b{font-family:var(--numeral);font-weight:400;font-size:64px;line-height:.9}
.fact b small{font-size:.45em}
.fact:hover{background:#0b0b0b;color:var(--yellow)}
.fact.bad{background:var(--pink)}
.fact.bad:hover{background:#0b0b0b;color:var(--pink)}
.fact.warnf b{text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:8px;text-decoration-color:var(--pink)}
.caption{font-family:var(--serif);font-style:italic;font-size:var(--fs-cap);color:#0b0b0b;grid-column:1/-1;text-align:right}

/* 號外 */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:start;padding:var(--s4) var(--s5);background:var(--pink);color:#0b0b0b;border:var(--rule) solid #0b0b0b}
.alert .tag{font-family:var(--display);font-weight:900;font-size:var(--fs-xl);line-height:1;letter-spacing:-.03em;padding-top:2px}
.alert p{font-family:var(--serif);font-size:var(--fs-base)}
.alert p b{font-family:var(--sans);font-weight:900}
.alert .linkbtn{color:#0b0b0b}
.alert .linkbtn:hover{background:#0b0b0b;color:var(--pink)}

/* 下一關 */
.gate{background:#0b0b0b;color:#f4f2ea;padding:var(--s5);border:var(--rule) solid var(--ink)}
.gate .tag{font-weight:900;font-size:var(--fs-sm);background:var(--yellow);color:#0b0b0b;display:inline-block;padding:2px 8px}
.gate .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);margin-top:var(--s3)}
.gate h3{font-family:var(--display);font-weight:900;font-size:var(--fs-2xl);letter-spacing:-.04em;line-height:1}
.gate .days{text-align:right;flex:none}
.gate .days b{display:block;font-family:var(--numeral);font-weight:400;font-size:84px;line-height:.8;color:var(--yellow)}
.gate .days span{font-size:var(--fs-cap)}
.gate dl.kv dt{color:#cfcabd}
.gate .linkbtn{color:#f4f2ea}
.gate .linkbtn:hover{background:var(--yellow);color:#0b0b0b}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s4);margin:var(--s4) 0 0;font-size:var(--fs-sm)}
dl.kv dt{font-weight:900;white-space:nowrap}
dl.kv dd{margin:0;font-family:var(--serif)}

/* ---------- 工作表（雜誌式表格） ---------- */
.tbox{container:tl / inline-size}
.tlist{list-style:none;margin:0;padding:0}
.tlist>li{border-bottom:1px solid var(--hair)}
.thead,.trow{display:grid;grid-template-columns:84px minmax(0,1fr) 92px 92px 116px 128px 24px;gap:var(--s3);align-items:center}
.thead{padding:8px 0;font-weight:900;font-size:var(--fs-cap);border-bottom:var(--rule) solid var(--hair)}
.trow{width:100%;min-height:60px;padding:10px 0;border:0;background:none;text-align:left;color:inherit;text-decoration:none}
.trow:hover{background:var(--yellow);color:#0b0b0b}
.trow:hover .st-todo{background:var(--yellow);color:#0b0b0b;border-color:#0b0b0b}
.trow:hover .grp{background:#0b0b0b;color:var(--yellow)}
.trow[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.trow[aria-expanded="true"] .grp{background:var(--paper);color:var(--ink)}
.trow[aria-expanded="true"] .st-todo{border-color:var(--paper);color:var(--paper);background:none}
.trow[aria-expanded="true"] .st-done{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.trow .code{font-family:var(--numeral);font-size:var(--fs-lg);line-height:1}
.trow .ttl{font-weight:700;font-size:var(--fs-md);min-width:0}
.trow .ttl small{display:block;font-family:var(--serif);font-weight:400;font-size:var(--fs-cap);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ownc{font-weight:700;font-size:var(--fs-sm)}
.trow .dates{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;font-weight:700}
.trow .dates small{display:block;font-family:var(--serif);font-weight:400;font-size:var(--fs-cap)}
.trow .stc{display:flex;flex-wrap:wrap;gap:4px}
.trow .mmeta{display:none}
.trow .chev{transition:transform 120ms var(--cut)}
.trow[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tdetail{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--cut)}
.tdetail.open{grid-template-rows:1fr}
.tdetail>div{overflow:hidden;visibility:hidden;transition:visibility 0s 220ms}
.tdetail.open>div{visibility:visible;transition:visibility 0s}
.tdetail .in{padding:var(--s4) var(--s3) var(--s5) calc(84px + var(--s3));display:grid;gap:var(--s3);font-size:var(--fs-sm);background:var(--tint);border-top:2px solid var(--hair)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:var(--fs-cap);color:var(--ink)}
.chipbtn:hover{background:var(--yellow);color:#0b0b0b}
.chipbtn[disabled]{opacity:.6;cursor:not-allowed;border-style:dashed}
.lab{font-weight:900;font-size:var(--fs-cap);margin-bottom:6px}
.flash{animation:flash 900ms steps(3)}
@keyframes flash{0%,66%{background:var(--pink);color:#0b0b0b}}
@container tl (max-width:1000px){
  .thead,.trow{grid-template-columns:72px minmax(0,1fr) 84px 108px 128px 24px}
  .thead .grpc,.trow .grpc{display:none}
}
@container tl (max-width:760px){
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) 24px;grid-template-areas:"ttl chev" "meta meta";gap:8px var(--s2);padding:var(--s3) 0}
  .trow .code,.trow .grpc,.trow .ownc,.trow .dates,.trow .stc{display:none}
  .trow .ttl{grid-area:ttl}
  .trow .chev{grid-area:chev}
  .trow .mmeta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:var(--fs-cap);font-weight:700}
  .tdetail .in{padding:var(--s4) var(--s3)}
}

/* 工具列 */
.toolbar{display:grid;gap:var(--s3);padding:var(--s4) 0;border-bottom:var(--rule) solid var(--hair)}
.trow2{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center}
.search{position:relative;flex:1 1 280px;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
input[type=search],select{width:100%;min-height:48px;font-size:16px;font-weight:700;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);padding:0 12px;border-radius:0}
input[type=search]{padding-left:44px}
select{width:auto;min-width:150px;padding-right:34px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
input[type=search]:focus,select:focus{outline:none;background-color:var(--yellow);color:#0b0b0b;border-color:#0b0b0b}
.search:focus-within svg{color:#0b0b0b}
input::placeholder{color:var(--ink-3);font-weight:500}
input[type=search]:focus::placeholder{color:#3a3a3a}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:0;border-right:1px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:var(--fs-sm)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--yellow);color:#0b0b0b}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button .n{font-family:var(--numeral);font-weight:400;font-size:var(--fs-md)}

/* ---------- 資料 ---------- */
const GROUPS=[{name:"總召、副召",short:"總召"},{name:"廠商對接 B2B",short:"B2B"},{name:"賽事運行",short:"賽事"},{name:"行銷公關 B2C",short:"B2C"},{name:"事務行政",short:"事務"}];

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const day=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
const DAY=864e5,diff=(a,b)=>Math.round((a-b)/DAY);
const md=s=>{const d=day(s);return d?`${d.getMonth()+1}/${d.getDate()}`:"—";};
const money=n=>"NT$"+Math.round(n).toLocaleString("en-US");
const tasks=DATA.tasks.map(t=>{const s=day(t.start),e=day(t.end);let k;
  if(t.status==="完成")k="done";else if(t.status==="卡住")k="blocked";else if(e&&e<today)k="late";
  else if(s&&s<=today)k=t.status==="進行中"?"doing":"now";else k=t.status==="進行中"?"doing":"todo";
  return Object.assign({},t,{k,s,e});});
const byCode=Object.fromEntries(tasks.map(t=>[t.code,t]));
const KL={done:"完成",blocked:"卡住",late:"逾期",now:"該開始了",doing:"進行中",todo:"未開始"};
const KI={done:"check-circle-linear",blocked:"danger-triangle-linear",late:"alarm-linear",now:"clock-circle-linear",doing:"clock-circle-linear",todo:"clock-circle-linear"};
const stc=t=>`<span class="st st-${t.k}">${ic(KI[t.k])}${KL[t.k]}</span>`+(t.missing?`<span class="st st-missing" title="原規劃有這項工作，但活動總表目前沒有">總表缺漏</span>`:"");
const grp=g=>`<span class="grp" title="${esc(g)}">${esc(SHORT(g))}</span>`;
const evStart=day(DATA.eventStart);
const pendDec=DATA.decisions.filter(d=>d.type!=="已確認");
const left=diff(evStart,today);

/* ---------- 導覽 ---------- */
const VIEWS=[
  {id:"overview",l:"總覽",i:"widget-5-linear",c:"yellow",d:"今天該知道的事。"},
  {id:"timeline",l:"時間軸",i:"calendar-linear",c:"blue",d:"2026 年 11 月到 2027 年 5 月，每一項工作排在哪裡。",big:()=>`${DATA.milestones.length}<small>個關卡</small>`},
  {id:"tasks",l:"工作",i:"checklist-minimalistic-linear",c:"yellow",n:tasks.length,d:"每一項工作都在這裡：篩選、搜尋、展開看前置工作。",big:()=>`${tasks.length}<small>項工作</small>`},
  {id:"milestones",l:"關卡",i:"flag-linear",c:"pink",n:DATA.milestones.length,d:`沒過就不往下走的 ${DATA.milestones.length} 個日期。`,big:()=>`${DATA.milestones.filter(m=>day(m.date)<today||m.status==="完成").length}/${DATA.milestones.length}<small>已過關卡</small>`},
  {id:"decisions",l:"待決事項",i:"chat-square-check-linear",c:"blue",n:pendDec.length,d:"幹部會議要拍板、或還在等學校回覆的事。",big:()=>`${pendDec.length}<small>件待決</small>`},
  {id:"people",l:"組別與人員",i:"users-group-rounded-linear",c:"yellow",d:"誰負責什麼，按一下名字就篩出他的工作。",big:()=>`${DATA.people.length}<small>位幹部</small>`},
  {id:"budget",l:"經費",i:"wallet-money-linear",c:"pink",d:"要花多少、錢從哪裡來、還差多少。",big:()=>`${Math.round(DATA.budget.total[2]/1000)}K<small>方案三總支出</small>`},
  {id:"start",l:"新手上手",i:"compass-linear",c:"blue",d:"第一次接手的幹部，從這裡開始。",big:()=>`5<small>個步驟</small>`}];
const navItem=(v,i)=>`<li><a href="#${v.id}" data-v="${v.id}">${ic(v.i)}<span class="key">${i+1}</span><span>${v.l}</span>${v.n!=null?`<span class="cnt">${v.n}</span>`:""}</a></li>`;
document.getElementById("sidenav").innerHTML=VIEWS.map(navItem).join("");
document.getElementById("morenav").innerHTML=VIEWS.slice(4).map((v,i)=>navItem(v,i+4)).join("");
const tabbar=document.getElementById("tabbar");
tabbar.innerHTML=VIEWS.slice(0,4).map(v=>`<a href="#${v.id}" data-v="${v.id}">${ic(v.i)}<span>${v.l}</span></a>`).join("")+`<button type="button" id="more-open" aria-haspopup="dialog" aria-expanded="false" aria-controls="more">${ic("menu-dots-linear")}<span>更多</span></button>`;
const more=document.getElementById("more"),moreOpen=document.getElementById("more-open");
document.getElementById("more-close").innerHTML=ic("close-circle-linear");
moreOpen.addEventListener("click",()=>{more.showModal();moreOpen.setAttribute("aria-expanded","true");});
more.addEventListener("close",()=>moreOpen.setAttribute("aria-expanded","false"));
document.getElementById("more-close").addEventListener("click",()=>more.close());
more.addEventListener("click",e=>{if(e.target===more||e.target.closest("a"))more.close();});
document.getElementById("btn-search").innerHTML=ic("magnifer","sm");
document.getElementById("issue").textContent=`第 ${DATA.snapshot.replace(/-/g,".")} 期｜資料快照`;
document.getElementById("cd").innerHTML=left>=0?`<span class="num">${left}</span><small>天後開演</small>`:`<small>活動已結束</small>`;
document.getElementById("foot").innerHTML=`<span>資料快照 ${esc(DATA.snapshot)}，來源：本活動_活動總表_v2。本頁唯讀，進度請改活動總表。</span><span>本頁不含電話、Email 等個資。</span><span>圖示：Solar Icons（480 Design，CC BY 4.0）</span>`;

/* ---------- 狀態 ---------- */
const state={group:"全部",status:"全部",q:"",owner:"",sort:"end",tview:""};
try{Object.assign(state,JSON.parse(localStorage.getItem("dash-filter")||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem("dash-filter",JSON.stringify(state));}catch(e){}};
const toast=(msg,icon)=>{const t=document.getElementById("toast");t.innerHTML=(icon?ic(icon,"sm"):"")+esc(msg);t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200);};
let pendingFocus=null;

/* ---------- 路由 ---------- */
const opener=document.getElementById("opener");
function current(){const v=(location.hash||"#overview").slice(1);return VIEWS.some(x=>x.id===v)?v:"overview";}
function go(v){if(current()===v&&location.hash)route();else location.hash=v;}
let first=true;
function route(){
  const v=current(),meta=VIEWS.find(x=>x.id===v);
  document.documentElement.style.setProperty("--spread",`var(--${meta.c})`);
  document.documentElement.style.setProperty("--on-spread",`var(--on-${meta.c})`);
  document.querySelectorAll("[data-v]").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("vtitle").textContent=meta.l;
  document.getElementById("vmeta").textContent=meta.d;
  document.getElementById("vbig").innerHTML=meta.big?meta.big():"";
  opener.hidden=v==="overview";
  document.title=`${meta.l}｜本活動專案中控台`;
  if(!RM&&!first&&v!=="overview"){opener.classList.remove("cut");void opener.offsetWidth;opener.classList.add("cut");}
  const pf=pendingFocus;
  main.innerHTML=R[v]();
  if(!first){window.scrollTo({top:0});if(!pf)main.focus({preventScroll:true});}
  (A[v]||(()=>{}))();
  first=false;
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,select,textarea,dialog")||e.metaKey||e.ctrlKey||e.altKey)return;
  const n=+e.key;if(n>=1&&n<=VIEWS.length){go(VIEWS[n-1].id);}
  if(e.key==="/"){e.preventDefault();openSearch();}
});
function openSearch(){if(current()!=="tasks"){pendingFocus="q";go("tasks");}else document.getElementById("q")?.focus();}
document.getElementById("btn-search").addEventListener("click",openSearch);
document.getElementById("btn-copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(location.href);toast("已複製這頁的連結","check-circle-linear");}
  catch(e){toast("無法自動複製，請從瀏覽器網址列複製","danger-triangle-linear");}});
function jump(filter){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""},filter);save();go("tasks");}
function showTask(code){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""});save();pendingFocus="task:"+code;go("tasks");}
main.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();jump(JSON.parse(j.dataset.jump));return;}
  const t=e.target.closest("[data-task]");if(t){e.preventDefault();showTask(t.dataset.task);}
});

const R={},A={};
const W=html=>`<div class="wrap"><div class="view">${html}</div></div>`;
const panelH=(h,sub,right)=>`<div class="panel-h"><div><h2>${h}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div>${right||""}</div>`;
const more_=(href,label)=>`<a class="linkbtn" href="${href}">${label}${ic("arrow-right-linear","sm")}</a>`;

/* ---------- 總覽（封面） ---------- */
R.overview=()=>{
  const done=tasks.filter(t=>t.k==="done").length,late=tasks.filter(t=>t.k==="late").length,blocked=tasks.filter(t=>t.k==="blocked").length;
  const un=tasks.filter(t=>!t.owner&&t.k!=="done").length;
  const wk=new Date(+today+7*DAY),week=tasks.filter(t=>t.k!=="done"&&t.s&&t.s<=wk&&t.e>=today).sort((a,b)=>a.e-b.e);
  const weekUn=week.filter(t=>!t.owner).length;
  const nx=DATA.milestones.find(m=>day(m.date)>=today&&m.status!=="完成");
  const dec=pendDec.filter(d=>d.due).sort((a,b)=>day(a.due)-day(b.due));
  const b=DATA.budget,conf=b.income.filter(i=>i.status==="已確認").reduce((s,i)=>s+i.amount,0);
  const fact=(cls,icon,label,val,f)=>`<a class="fact ${cls}" href="#tasks" data-jump='${JSON.stringify(f)}'><span>${ic(icon,"sm")}${label}</span><b>${val}</b></a>`;
  const L=Math.max(left,0);
  return `<section class="cover" aria-labelledby="cover-h"><div class="wrap">
    <div class="hed"><span class="n${RM?"":" reg"}" aria-hidden="true">${L}</span><h1 id="cover-h"><span class="sr">距離活動還有 ${L} 天：</span>天後開演<span class="dek">活動第一天 ${md(DATA.eventStart)}（日期待確認）</span></h1></div>
    <div class="coverlines">
      ${nx?`<a class="cl" href="#milestones"><small>下一關｜${md(nx.date)} 截止</small><b>「${esc(nx.title)}」還有 <span class="num">${diff(day(nx.date),today)}</span> 天</b></a>`:""}
      <a class="cl" href="#tasks" data-jump='{"status":"待處理"}'><small>未來 7 天</small><b><span class="num">${week.length}</span> 件工作要動${weekUn?`，<span class="num">${weekUn}</span> 件沒人負責`:""}</b></a>
      <a class="cl" href="#budget"><small>經費｜已確認 ${money(conf)}</small><b>還缺 <span class="num">${money(b.gapConfirmed[2])}</span></b></a>
    </div>
    <div class="facts">
      ${fact("","check-circle-linear","完成",`${done}<small>/${tasks.length}</small>`,{status:"完成"})}
      ${fact(late?"bad":"","alarm-linear","逾期",late,{status:"逾期"})}
      ${fact(blocked?"bad":"","danger-triangle-linear","卡住",blocked,{status:"卡住"})}
      ${fact(un?"warnf":"","user-cross-linear","未指派",un,{owner:"__none",status:"待處理"})}
    </div>
    <p class="caption">資料快照 ${esc(DATA.snapshot)}｜每一行都可以點</p></div></section>
  ${W(`${DATA.missingCount?`<div class="alert"><span class="tag">號外</span><div><p><b>活動總表少了 ${DATA.missingCount} 項工作。</b>總表目前只有 ${DATA.sheetCount} 項；總召、賽事、B2C 的工作全部不在表裡，B2B 與事務行政也少了幾項。這些工作在本頁標成「總表缺漏」，請總召確認後補回活動總表。</p>
    <a class="linkbtn" href="#tasks" data-jump='{"status":"總表缺漏"}'>看 ${DATA.missingCount} 項缺漏工作${ic("arrow-right-linear","sm")}</a></div></div>`:""}
  <div class="cols">
    <section class="panel" aria-labelledby="h-week">${panelH(`<span id="h-week">未來 7 天要動的工作</span>`,`依截止日排序，共 ${week.length} 項`,more_("#tasks","全部工作"))}
      ${week.length?`<div class="tbox"><ul class="tlist">${week.map(t=>`<li>${taskRow(t,false)}</li>`).join("")}</ul></div>`:`<div class="empty">${ic("check-circle-linear")}<p>未來 7 天沒有排定的工作。</p></div>`}</section>
    <div class="stack">
      ${nx?`<section class="gate" aria-labelledby="h-gate"><span class="tag">下一關</span><div class="row1"><h3 id="h-gate">${esc(nx.title)}</h3><div class="days"><b>${diff(day(nx.date),today)}</b><span>天後｜${md(nx.date)}</span></div></div>
        <dl class="kv"><dt>通過條件</dt><dd>${esc(nx.cond)}</dd><dt>沒過怎麼辦</dt><dd>${esc(nx.fallback)}</dd><dt>主責</dt><dd>${esc(nx.group)}</dd></dl>
        <div style="margin-top:12px">${more_("#milestones",`全部 ${DATA.milestones.length} 個關卡`)}</div></section>`:""}
      <section class="panel" aria-labelledby="h-dec">${panelH(`<span id="h-dec">最近要拍板</span>`,"",more_("#decisions",`全部 ${pendDec.length} 項`))}
        <ul class="dlist">${dec.slice(0,4).map(d=>`<li style="grid-template-columns:minmax(0,1fr) auto"><div><div class="q">${esc(d.q)}</div><div class="rec">建議：${esc(d.rec)}</div></div><div class="due"><span>${md(d.due)}</span></div></li>`).join("")}</ul></section>
    </div>
  </div>
  <section class="panel" aria-labelledby="h-grp">${panelH(`<span id="h-grp">各組進度</span>`,"點組名看該組全部工作",`<span class="legend"><span><i style="width:12px;height:12px;background:var(--ink)"></i>完成</span><span><i style="width:12px;height:12px;background:var(--blue)"></i>進行中、該開始</span><span><i style="width:12px;height:12px;background:var(--pink)"></i>逾期、卡住</span></span>`)}
    <div class="gtable">${GROUPS.map(g=>{const ts=tasks.filter(t=>t.group===g.name);if(!ts.length)return"";const c=k=>ts.filter(t=>k.includes(t.k)).length/ts.length*100,miss=ts.filter(t=>t.missing).length,dn=ts.filter(t=>t.k==="done").length;
      return `<div class="grow"><a class="gname linkbtn" href="#tasks" data-jump='${JSON.stringify({group:g.name})}' aria-label="看${esc(g.name)}全部工作">${grp(g.name)}<span style="margin-left:8px">${esc(g.name)}</span></a>
        <div class="prog" role="img" aria-label="${esc(g.name)}：完成 ${dn} 項，共 ${ts.length} 項"><i style="width:${c(["done"])}%;background:var(--ink)"></i><i style="width:${c(["doing","now"])}%;background:var(--blue)"></i><i style="width:${c(["late","blocked"])}%;background:var(--pink)"></i></div>
        <span class="n">${dn}/${ts.length}</span><span class="m">${miss?`缺漏 ${miss} 項`:""}</span></div>`;}).join("")}</div></section>`)}`;
};

/* ---------- 工作列 ---------- */
function taskRow(t,expandable){
  const rem=t.k==="late"?`逾期 ${diff(today,t.e)} 天`:(t.e?`剩 ${diff(t.e,today)} 天`:"");
  const owner=t.owner?esc(t.owner):`<span class="owner-none">未指派</span>`;
  const inner=`<span class="code">${esc(t.code)}</span>
    <span class="ttl">${esc(t.title)}${t.note?`<small>${esc(t.note)}</small>`:""}</span>
    <span class="grpc">${grp(t.group)}</span><span class="ownc">${owner}</span>
    <span class="dates">${md(t.start)}–${md(t.end)}${t.k!=="done"&&rem?`<small>${rem}</small>`:""}</span>
    <span class="stc">${stc(t)}</span>
    <span class="mmeta">${stc(t)}${grp(t.group)}<span>${owner}</span><span class="tab-num">${md(t.start)}–${md(t.end)}</span>${t.k!=="done"&&rem?`<span>${rem}</span>`:""}</span>
    <span class="chev">${ic(expandable?"alt-arrow-down-linear":"arrow-right-linear","sm")}</span>`;
  return expandable
    ?`<button type="button" class="trow${t.missing?" missing":""}" id="row-${esc(t.code)}" aria-expanded="false" aria-controls="det-${esc(t.code)}" data-row="${esc(t.code)}">${inner}</button>
      <div class="tdetail" id="det-${esc(t.code)}" role="region" aria-label="${esc(t.title)} 詳細"><div><div class="in">${detail(t)}</div></div></div>`
    :`<a class="trow${t.missing?" missing":""}" href="#tasks" data-task="${esc(t.code)}">${inner}</a>`;
}
function detail(t){
  const pres=(t.pre||"").split(/[,，、\s]+/).filter(Boolean);
  const after=tasks.filter(x=>(x.pre||"").split(/[,，、\s]+/).includes(t.code));
  const chip=c=>byCode[c]?`<button type="button" class="chipbtn" data-goto="${esc(c)}">${esc(c)} ${esc(byCode[c].title)}</button>`:`<button type="button" class="chipbtn" disabled title="這個編號在資料中找不到">${esc(c)}（找不到）</button>`;
  return `<dl class="kv" style="margin:0">
    <dt>負責</dt><dd>${esc(t.group)}　${t.owner?esc(t.owner):'<span class="owner-none">還沒指派個人</span>'}</dd>
    <dt>期間</dt><dd>${md(t.start)} 到 ${md(t.end)}（${t.s&&t.e?diff(t.e,t.s)+1:"—"} 天）</dd>
    ${t.note?`<dt>備註</dt><dd>${esc(t.note)}</dd>`:""}
    ${t.missing?`<dt>資料</dt><dd>原規劃有這項工作，但活動總表目前沒有。請總召確認後補回總表。</dd>`:""}</dl>
    ${pres.length?`<div><p class="lab">要先完成</p><div class="chips">${pres.map(chip).join("")}</div></div>`:""}
    ${after.length?`<div><p class="lab">完成後才能開始</p><div class="chips">${after.map(x=>chip(x.code)).join("")}</div></div>`:""}`;
}

/* ---------- 工作 ---------- */
const STATUS=["全部","待處理","逾期","卡住","完成","總表缺漏"];
const stMatch=(s,t)=>s==="全部"||(s==="待處理"&&t.k!=="done")||(s==="逾期"&&t.k==="late")||(s==="卡住"&&t.k==="blocked")||(s==="完成"&&t.k==="done")||(s==="總表缺漏"&&t.missing);
function matches(t){const q=state.q.trim().toLowerCase();
  return (state.group==="全部"||t.group===state.group)&&stMatch(state.status,t)
    &&(!state.owner||(state.owner==="__none"?!t.owner:t.owner===state.owner))
    &&(!q||(t.code+t.title+t.note+t.owner+t.group).toLowerCase().includes(q));}
const activeFilters=()=>(state.group!=="全部")+(state.status!=="全部")+(!!state.owner)+(!!state.q.trim());
const gseg=()=>`<div class="seg" role="group" aria-label="組別">${["全部",...GROUPS.map(g=>g.name)].map(n=>`<button type="button" data-g="${esc(n)}" aria-pressed="${state.group===n}">${n==="全部"?"全部組別":esc(SHORT(n))}</button>`).join("")}</div>`;
R.tasks=()=>{const owners=[...new Set(tasks.map(t=>t.owner).filter(Boolean))];
  return W(`<section class="panel" aria-label="工作清單">
    <div class="toolbar">
      <div class="trow2">
        <div class="search">${ic("magnifer","sm")}<label class="sr" for="q">搜尋工作</label><input type="search" id="q" placeholder="搜尋工作名稱、編號、負責人" value="${esc(state.q)}" autocomplete="off"></div>
        <button type="button" class="btn plain filterbtn" id="fbtn" aria-expanded="false" aria-controls="filters">${ic("filter-linear","sm")}篩選<span id="fcount"></span></button>
      </div>
      <div class="filters trow2" id="filters">
        ${gseg()}
        <div class="seg" role="group" aria-label="狀態">${STATUS.map(s=>`<button type="button" data-st="${s}" aria-pressed="${state.status===s}">${s}<span class="n">${tasks.filter(t=>stMatch(s,t)).length}</span></button>`).join("")}</div>
        <label class="sr" for="owner">負責人</label><select id="owner"><option value="">所有負責人</option>${owners.map(o=>`<option ${state.owner===o?"selected":""}>${esc(o)}</option>`).join("")}<option value="__none" ${state.owner==="__none"?"selected":""}>未指派</option></select>
        <label class="sr" for="sort">排序</label><select id="sort"><option value="end" ${state.sort==="end"?"selected":""}>依截止日</option><option value="start" ${state.sort==="start"?"selected":""}>依開始日</option><option value="code" ${state.sort==="code"?"selected":""}>依編號</option></select>
      </div>
      <div class="result"><span id="tcount" aria-live="polite"></span><button type="button" class="btn" id="clear" hidden>${ic("close-circle-linear","sm")}清除篩選</button></div>
    </div>
    <div class="tbox"><div class="thead" aria-hidden="true"><span>編號</span><span>工作</span><span class="grpc">組別</span><span>負責人</span><span>日期</span><span>狀態</span><span></span></div>
    <ul class="tlist" id="tlist"></ul></div></section>`);};
A.tasks=()=>{
  const list=document.getElementById("tlist"),cnt=document.getElementById("tcount"),clear=document.getElementById("clear"),fc=document.getElementById("fcount");
  const sorters={end:(a,b)=>a.e-b.e||a.code.localeCompare(b.code),start:(a,b)=>a.s-b.s||a.e-b.e,code:(a,b)=>a.code.localeCompare(b.code,"zh-Hant",{numeric:true})};
  const draw=()=>{const L=tasks.filter(matches).sort(sorters[state.sort]||sorters.end);
    list.innerHTML=L.length?L.map(t=>`<li>${taskRow(t,true)}</li>`).join(""):`<li><div class="empty">${ic("magnifer")}<p>沒有符合條件的工作。</p><button type="button" class="btn" data-clear>清除篩選</button></div></li>`;

  const reset=()=>{Object.assign(state,{group:"全部",status:"全部",q:"",owner:""});save();route();};
  main.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{state.group=b.dataset.g;save();main.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();}));
  main.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>{state.status=b.dataset.st;save();main.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();}));
  document.getElementById("owner").addEventListener("change",e=>{state.owner=e.target.value;save();draw();});
  document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;save();draw();});
  let deb;document.getElementById("q").addEventListener("input",e=>{clearTimeout(deb);deb=setTimeout(()=>{state.q=e.target.value;save();draw();},120);});
  clear.addEventListener("click",reset);
  const fb=document.getElementById("fbtn"),fl=document.getElementById("filters");
  fb.addEventListener("click",()=>{const o=!fl.classList.contains("open");fl.classList.toggle("open",o);fb.setAttribute("aria-expanded",String(o));});
  list.addEventListener("click",e=>{
    if(e.target.closest("[data-clear]")){reset();return;}
    const g=e.target.closest("[data-goto]");if(g){openRow(g.dataset.goto);return;}
    const r=e.target.closest("[data-row]");if(r){const o=r.getAttribute("aria-expanded")!=="true";r.setAttribute("aria-expanded",String(o));document.getElementById("det-"+r.dataset.row).classList.toggle("open",o);}
  });
  function openRow(code){let r=document.getElementById("row-"+code);
    if(!r){Object.assign(state,{group:"全部",status:"全部",q:"",owner:""});save();main.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.g==="全部"));main.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.st==="全部"));document.getElementById("q").value="";document.getElementById("owner").value="";draw();r=document.getElementById("row-"+code);}
    if(!r)return;r.setAttribute("aria-expanded","true");document.getElementById("det-"+code).classList.add("open");
    const y=r.getBoundingClientRect().top+scrollY-80;window.scrollTo({top:y,behavior:RM?"auto":"smooth"});r.focus({preventScroll:true});
    r.classList.remove("flash");void r.offsetWidth;r.classList.add("flash");}
  draw();
  if(pendingFocus==="q"){document.getElementById("q").focus();}
  else if(pendingFocus&&pendingFocus.startsWith("task:")){const c=pendingFocus.slice(5);requestAnimationFrame(()=>openRow(c));}
  pendingFocus=null;
};

A.timeline=()=>{
  const tv=state.tview||(matchMedia("(max-width:767px)").matches?"list":"gantt"),el=document.getElementById("tl");
  const gs=GROUPS.filter(g=>state.group==="全部"||state.group===g.name);

    const start=new Date(2026,10,1),end=new Date(2027,5,1),span=end-start,x=d=>Math.max(0,Math.min(100,(d-start)/span*100));

    const bars=months.map((_,i)=>`<div class="bar" style="left:${i/months.length*100}%"></div>`).join("")+`<div class="dbar" style="left:${x(evStart)}%"></div>`;
    const on=today>=start&&today<end,ph=on?`<div class="playhead" style="left:${x(today)}%"></div>`:"",phL=on?`<div class="playhead" style="left:${x(today)}%"><span>今天 ${today.getMonth()+1}/${today.getDate()}</span></div>`:"";
    let h=`<div class="gh"><div class="gl" style="font-weight:900">工作</div><div class="gt"><div class="months">${months.map(m=>`<span>${m}</span>`).join("")}</div></div></div>`;

    let i=0;
    gs.forEach(g=>{const L=tasks.filter(t=>t.group===g.name).sort((a,b)=>a.s-b.s);if(!L.length)return;
      h+=`<div class="gr gg"><div class="gl">${esc(g.name)}<span class="num" style="margin-left:auto;font-size:18px">${L.length}</span></div><div class="gt" style="min-height:30px">${bars}${ph}</div></div>`;
      L.forEach(t=>{const l=x(t.s),w=Math.max(.7,x(new Date(+t.e+DAY))-l),lab=`${t.code} ${t.title}，${md(t.start)} 到 ${md(t.end)}，${t.owner||"未指派"}，${KL[t.k]}${t.missing?"，總表缺漏":""}`;
        h+=`<div class="gr"><div class="gl"><button type="button" data-task="${esc(t.code)}" title="${esc(t.title)}"><span class="code">${esc(t.code)}</span><span class="nm">${esc(t.title)}</span></button></div><div class="gt">${bars}
          <button type="button" class="gb${t.missing?" missing":""}${t.k==="done"?" done":""}${t.k==="late"||t.k==="blocked"?" alertb":""}" style="left:${l}%;width:${w}%;animation-delay:${Math.min(i++*12,600)}ms" data-task="${esc(t.code)}" aria-label="${esc(lab)}" title="${esc(lab)}" tabindex="-1"></button>${ph}</div></div>`;});});
    el.innerHTML=`<div class="gwrap" tabindex="0" aria-label="甘特圖，可左右捲動"><div class="gantt">${h}</div></div>`;
    const w=el.querySelector(".gwrap");if(on&&w.scrollWidth>w.clientWidth){const pos=(x(today)/100)*(w.scrollWidth-260);w.scrollLeft=Math.max(0,pos-120);}
  }else{
    const ms=new Map();
    tasks.filter(t=>gs.some(g=>g.name===t.group)).sort((a,b)=>a.e-b.e).forEach(t=>{const k=`${t.e.getFullYear()}-${t.e.getMonth()}`;if(!ms.has(k))ms.set(k,{d:t.e,t:[],m:[]});ms.get(k).t.push(t);});
    DATA.milestones.forEach(m=>{const d=day(m.date),k=`${d.getFullYear()}-${d.getMonth()}`;if(!ms.has(k))ms.set(k,{d,t:[],m:[]});ms.get(k).m.push(m);});
    const keys=[...ms.keys()].sort((a,b)=>ms.get(a).d-ms.get(b).d);
    el.innerHTML=`<ul class="agenda">${keys.map(k=>{const o=ms.get(k);return `<li><h3><span class="num">${o.d.getMonth()+1}</span>月 ${o.d.getFullYear()}<small>${o.t.length} 項到期</small></h3>
      ${o.m.map(m=>`<div class="ms-i">${ic("flag-linear","sm")}${md(m.date)}　關卡：${esc(m.title)}</div>`).join("")}
      <ul>${o.t.map(t=>`<li><button type="button" class="ai" data-task="${esc(t.code)}"><span class="num" style="font-size:20px">${md(t.end)}</span><span style="min-width:0"><b style="display:block">${esc(t.title)}</b><span style="font-size:12px">${grp(t.group)} ${esc(t.owner||"未指派")}</span></span>${stc(t)}</button></li>`).join("")}</ul></li>`;}).join("")}</ul>`;
  }
  main.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{state.group=b.dataset.g;save();route();}));
  main.querySelectorAll("[data-tv]").forEach(b=>b.addEventListener("click",()=>{state.tview=b.dataset.tv;save();route();}));
